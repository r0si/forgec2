name: Release

# Actions are pinned to full commit SHAs (supply-chain hygiene: a moved tag
# cannot change what runs). Dependabot updates the SHA along with the trailing
# version comment — do not replace them with floating tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for actions/attest-build-provenance (SLSA-style build attestation).
  id-token: write
  attestations: write

jobs:
  webdist:
    name: Build frontend embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - name: Refresh embedded webdist
        run: |
          rm -rf internal/webdist/dist
          cp -r frontend/out internal/webdist/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webdist
          path: internal/webdist/dist

  # The container image a release publishes: multi-arch (linux/amd64 AND
  # linux/arm64), versioned (both v2.7.2 and 2.7.2), :latest, and sha-<commit>.
  # The build lives in container.yml so a manual run and a release produce the
  # same image shape.
  container:
    name: Publish container image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ github.ref_name }}
      platforms: 'linux/amd64,linux/arm64'
      publish_latest: true

  goreleaser:
    name: Cross-compile and release
    runs-on: ubuntu-latest
    needs: [webdist]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"

      - name: Download fresh webdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webdist
          path: internal/webdist/dist

      - name: Build sovereign-server (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          # The release repository is stamped into the binary so the update
          # checker polls the repository that actually publishes the releases
          # (a fork tags its own releases and must not point at upstream).
          # -s -w strips the symbol table and the DWARF data: the published
          # binary is 59.5 MB instead of 80.7 MB, and the one-click archives
          # shrink by the same. The version and repository stamps survive
          # (-X is applied after the strip).
          go build -ldflags "-s -w -X github.com/r0si/sovereign/internal/server.ServerVersion=${{ github.ref_name }} -X github.com/r0si/sovereign/internal/buildinfo.Repo=${{ github.repository }}" -o "$bin" ./cmd/server
          # Fail the job if the tag didn't make it into the binary.
          # (Windows/arm64 binaries can't execute on this runner — same
          # ldflags line builds them, and linux/amd64 proves the wiring.)
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "linux/amd64" ]; then
            if [ "$(./"$bin" -version)" != "${{ github.ref_name }}" ]; then
              echo "version mismatch: binary reports [$(./"$bin" -version)] but tag is [${{ github.ref_name }}]"
              exit 1
            fi
          fi
          # The published binary has a size budget, like the frontend bundle.
          # The stripped binary is 59.5 MiB; the ceiling leaves room for real
          # growth and catches a heavy dependency arriving unnoticed.
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "linux/amd64" ]; then
            size=$(stat -c %s "$bin")
            budget=$((70 * 1024 * 1024))
            if [ "$size" -gt "$budget" ]; then
              echo "the published binary is $((size / 1024 / 1024)) MiB, over the 70 MiB budget" >&2
              echo "see what grew: node scripts/binary-size.mjs --build" >&2
              exit 1
            fi
            echo "published binary: $((size / 1024 / 1024)) MiB (budget 70 MiB)"
          fi
          sha256sum "$bin" > "$bin.sha256"
          # Detached Ed25519 signature over the checksum file (hot-update
          # trust anchor: crypto.update_signing_key). Tag releases MUST ship
          # a .sig — fail closed so keyed servers can always verify. Manual
          # workflow_dispatch without a secret still skips (dev-only).
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            # Sign with the runner's own toolchain: this job exports
            # GOOS/GOARCH for the cross-compile, and a `go run` that honours
            # them produces a Windows PE that Linux cannot execute
            # ("exec format error"). GOHOSTOS/GOHOSTARCH ignore the env.
            GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
              go run ./cmd/sign-release "$bin.sha256"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_SIGNING_KEY secret is required for tag releases" >&2
            exit 1
          else
            echo "RELEASE_SIGNING_KEY unset (non-tag run): skipping detached signature for $bin.sha256"
          fi

      # The SBOM must exist before the upload step: the artifact glob below is
      # what carries it to create-release, and it used to be generated
      # afterwards, so the release announced an SBOM it never shipped.
      # `-json` is explicit: the tool defaults to XML, which would land in a
      # file named .sbom.json. A main module has no version of its own, so the
      # tool leaves the component version empty and the tag is stamped in.
      - name: Generate SBOM (CycloneDX, Go modules)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            mod -licenses -json -output sovereign-server-linux-amd64.sbom.json .
          jq --arg v "$GITHUB_REF_NAME" '.metadata.component.version = $v' \
            sovereign-server-linux-amd64.sbom.json > sbom.tmp
          mv sbom.tmp sovereign-server-linux-amd64.sbom.json
          jq -e '.metadata.component.version != null' \
            sovereign-server-linux-amd64.sbom.json > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  bundle:
    name: One-click bundle (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [goreleaser]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the platform binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: incoming

      - name: Assemble the archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="sovereign-v${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          stage="stage/$name"
          mkdir -p "$stage"

          # Exactly one binary per artifact; checksum/signature siblings are
          # filtered out so a second match cannot slip into the archive — and
          # the SBOM lives in the same artifact, so it must be named here too.
          src="$(find incoming -maxdepth 1 -type f \
            -name 'sovereign-server-${{ matrix.goos }}-${{ matrix.goarch }}*' \
            | grep -vE '\.sha256$|\.sig$|\.sbom\.json$' | head -n1)"
          test -n "$src"

          cp config.example.yaml LICENSE packaging/QUICKSTART.txt "$stage/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "$src" "$stage/sovereign-server.exe"
            # cmd.exe is happiest with CRLF while the repository keeps LF for
            # byte-stable diffs: convert at packaging time, not in git.
            sed 's/$/\r/' packaging/windows/start.cmd > "$stage/start.cmd"
            ( cd stage && zip -qr "$name.zip" "$name" )
            archive="$name.zip"
          else
            cp "$src" "$stage/sovereign-server"
            cp packaging/linux/start.sh "$stage/start.sh"
            chmod +x "$stage/sovereign-server" "$stage/start.sh"
            # Reproducible tar: sorted entries, fixed owner and mtime.
            ( cd stage && tar --owner=0 --group=0 --numeric-owner --sort=name \
                --mtime="@${SOURCE_DATE_EPOCH:-0}" \
                -czf "$name.tar.gz" "$name" )
            archive="$name.tar.gz"
          fi

          # Hash from inside stage/ so the .sha256 records the bare file name:
          # `sha256sum -c` has to work in whatever folder the user downloaded to.
          ( cd stage && sha256sum "$archive" > "$archive.sha256" )
          out="stage/$archive"
          # Same trust anchor as the raw binaries: a detached Ed25519 signature
          # over the checksum file. Tag releases fail closed without a key.
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
              go run ./cmd/sign-release "$out.sha256"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_SIGNING_KEY secret is required for tag releases" >&2
            exit 1
          else
            echo "RELEASE_SIGNING_KEY unset (non-tag run): skipping signature for $out.sha256"
          fi
          ls -lh "$out"*

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sovereign-bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: stage/sovereign-*

  create-release:
    needs: [goreleaser, bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sovereign-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Lift the matching CHANGELOG section so release notes track the repo
          # instead of being maintained twice. The heading carries a date
          # ("## [2.7.0] - 2026-10-22"), so match the prefix, not the whole line,
          # and strip the tag's "v" to meet the changelog's bare version.
          awk -v tag="$version" '
            index($0, "## [" tag "]") == 1 {in_section=1; next}
            /^## \[/ && in_section {exit}
            in_section {print}
          ' CHANGELOG.md > changelog-section.md
          # Fail closed: an empty section would otherwise publish a release whose
          # "Changelog" heading is followed by nothing.
          test -s changelog-section.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          # GitHub truncates a release body past 125,000 characters, and a busy
          # release can reach that on its own (2.7.0's section is ~125k, cut
          # mid-sentence on the published page). Keep whole lines under a 60k
          # budget and link to the file for the remainder.
          if [ "$(wc -c < changelog-section.md)" -gt 60000 ]; then
            awk '{ n += length($0) + 1; if (n > 60000) exit; print }' \
              changelog-section.md > changelog-section.cut
            {
              cat changelog-section.cut
              echo ""
              echo "_Truncated at 60k characters: the full section is in_"
              echo "[CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
            } > changelog-section.md
          fi

          {
            echo "## Sovereign Server ${{ github.ref_name }}"
            echo ""
            echo "### One-click start (no toolchain required)"
            echo ""
            echo "The web console is embedded in the binary: no Node.js, no Go and no"
            echo "external database. Unpack the archive for your platform and start it."
            echo ""
            echo "| Platform | Start |"
            echo "| --- | --- |"
            echo "| Windows | unzip, then double-click \`start.cmd\` |"
            echo "| Linux | \`tar xzf <archive> && cd <dir> && ./start.sh\` |"
            echo ""
            for f in sovereign-v*-windows-*.zip sovereign-v*-linux-*.tar.gz; do
              [ -e "$f" ] || continue
              echo "- \`$f\` + \`.sha256\`"
            done
            echo ""
            echo "The first start creates \`config.yaml\`, prints the generated \`admin\`"
            echo "password and serves the console on \`https://127.0.0.1:8000/\`"
            echo "(self-signed certificate on first run). Every archive ships"
            echo "\`QUICKSTART.txt\`."
            echo ""
            echo "### Raw binaries"
            echo ""
            ls sovereign-server-* 2>/dev/null | grep -vE '\.sha256$|\.sig$|sbom' | sed 's/^/- /'
            echo ""
            echo "### Container image"
            echo ""
            echo "\`ghcr.io/r0si/sovereign:${GITHUB_REF_NAME}\` (and \`:latest\`) is a"
            echo "multi-arch manifest for **linux/amd64** and **linux/arm64**:"
            echo "\`docker pull ghcr.io/r0si/sovereign:${GITHUB_REF_NAME}\` picks the"
            echo "right leg automatically. Pin a digest for reproducible deployments."
            echo ""
            echo "Every binary and archive ships a \`.sha256\` checksum and a detached"
            echo "Ed25519 \`.sig\` over that checksum. Verify a download with"
            echo "\`go run ./cmd/sign-release -verify -key \$PUBKEY <file.sha256>\`"
            echo "(the public key is published in \`docs/DEPLOY.md\`). A CycloneDX"
            echo "SBOM is attached as \`sovereign-server-linux-amd64.sbom.json\`."
            echo ""
            echo "### Changelog"
            echo ""
            cat changelog-section.md
          } > release-notes.md
          test -s release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: sovereign-*
          body_path: release-notes.md
          draft: false
          prerelease: false
