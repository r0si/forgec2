name: CI

# Actions are pinned to full commit SHAs (supply-chain hygiene: a moved tag
# cannot change what runs). Dependabot updates the SHA along with the trailing
# version comment — do not replace them with floating tags.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly fuzz campaign (Mon 03:17 UTC). Seed corpora live in the repo, so a
    # crash is reproducible locally with a plain `go test -run=^$ -fuzz=...`.
    - cron: '17 3 * * 1'

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Go format check (changed files)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${GITHUB_EVENT_BEFORE:-HEAD}"
            [ "$base" = "0000000000000000000000000000000000000000" ] && base=HEAD
          fi
          files=$(git diff --name-only "$base" -- '*.go' || true)
          if [ -z "$files" ]; then
            echo "no Go files changed"
            exit 0
          fi
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt ok ($(echo "$files" | wc -l) Go files)"
      # The agent emits expected unsafe.Pointer vet warnings (Windows syscall
      # patterns); ignore only those while still failing on any other finding.
      - run: |
          go vet ./internal/... ./pkg/... ./cmd/... 2>vet.err || true
          grep -v "internal/payload/agent" vet.err > vet-filtered.err || true
          cat vet-filtered.err
          if grep -q . vet-filtered.err; then
            echo "go vet reported errors (excluding known agent warnings):"
            exit 1
          fi
      - name: Upload vet output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vet-output
          path: vet.err
      # scripting + cmd were previously untested here even though both ship
      # tests; keep the list explicit so runtime stays predictable.
      - name: Unit tests + coverage
        run: go test ./internal/config/... ./internal/crypto/... ./internal/db/... ./internal/malleable/... ./internal/obfuscation/... ./internal/payload/... ./internal/plugin/... ./internal/scripting/... ./internal/server/... ./pkg/... ./cmd/... -count=1 -timeout 8m -coverprofile=coverage.out
      - name: Coverage floor
        # Ratcheting floor. Measured 2026-10-25: 46.3% across this package list
        # (it was ~45.8% when the floor was 40, and 33 before the
        # security-critical handlers — privesc/evasion/roles/certs/
        # workflow-groups/browser-creds — went from 0% to ~75%). Raise this as
        # coverage grows and lower it only after adding tests, never to make a
        # regression pass.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total statement coverage: ${total}%"
          floor=44
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the ${floor}% floor"
            exit 1
          }
      - run: go build ./...
      - run: go build -o checkopenapi ./cmd/checkopenapi
      - name: OpenAPI check (core paths + min coverage)
        run: |
          ./checkopenapi -min-coverage 1.00
          # Fail if OpenAPI drifts ahead of backend (wrong docs)
          stale=$(./checkopenapi -list-stale | tail -n +2 | wc -l)
          test "$stale" -eq 0
      - name: Build server for smoke
        run: go build -o forgec2-server ./cmd/server
      - name: Version stamp check (ldflags must reach -version)
        run: |
          go build -ldflags "-X github.com/forgec2/forgec2/internal/server.ServerVersion=ci-test" -o forgec2-version-check ./cmd/server
          test "$(./forgec2-version-check -version)" = "ci-test"
          rm -f forgec2-version-check
      - name: Release repo stamp check (ldflags must reach the binary)
        run: |
          # The update checker polls the repository stamped here. A build that
          # loses the stamp silently checks a wrong (or no) repository and
          # reports "up to date" forever.
          go build -ldflags "-X github.com/forgec2/forgec2/internal/buildinfo.Repo=ci/stamp-check" -o forgec2-repo-check ./cmd/server
          grep -qa "ci/stamp-check" forgec2-repo-check
          rm -f forgec2-repo-check
      - name: API smoke (unauth + default admin)
        run: |
          # Fresh DB. config.example.yaml leaves auth.default_password empty
          # (secure default -> random password printed on first boot), so CI
          # injects a strong password for the login test and tells the smoke
          # script what it is.
          SMOKE_ADMIN_PASSWORD="S1mokeC2-$(openssl rand -hex 8)-9z!Z"
          sed "s/^  default_password:.*/  default_password: $SMOKE_ADMIN_PASSWORD/" config.example.yaml > config.ci.yaml
          rm -rf data/db
          mkdir -p data/db
          export SMOKE_ADMIN_PASSWORD
          ./forgec2-server -config config.ci.yaml > /tmp/forgec2-smoke.log 2>&1 &
          echo $! > /tmp/forgec2-smoke.pid
          for i in $(seq 1 30); do
            if curl -skf https://127.0.0.1:8000/health | grep -q ok; then break; fi
            sleep 1
          done
          chmod +x scripts/ci-api-smoke.sh
          scripts/ci-api-smoke.sh || {
            echo "=== server log (last 200 lines) ==="
            tail -n 200 /tmp/forgec2-smoke.log
            kill $(cat /tmp/forgec2-smoke.pid) || true
            exit 1
          }
          kill $(cat /tmp/forgec2-smoke.pid) || true

  race:
    name: Race detector (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server alone takes 11–14 minutes under -race locally; keeping
          # it in its own leg gives each half the full timeout instead of
          # sharing one 20-minute budget, and reports which half regressed.
          - suite: server
            packages: ./internal/server/...
          - suite: core
            packages: ./internal/db/... ./internal/plugin/... ./internal/scripting/... ./internal/payload/agent/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      # The server runs beacon handlers, plugin workers, audit/SIEM queues and
      # WebSocket fan-out concurrently; -race is the only gate that catches a
      # shared-state regression there.
      - name: go test -race
        run: go test -race ${{ matrix.packages }} -count=1 -timeout 20m

  # The C implant ships as source and is assembled on operator machines, so no
  # other job would notice a syntax error, a fresh compiler warning, a task type
  # that is dispatched but unreachable, or a WASM sample that no longer builds.
  c-implant:
    name: C implant + WASM example build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 clang lld
      # sqlite3.c/sqlite3.h are vendored locally but gitignored (9 MB of
      # third-party code does not belong in the repository), so the gate
      # fetches the release the tree is built against, verifies the exact
      # bytes and reads the version macro back out of the file.
      - name: Fetch the vendored SQLite amalgamation (3.46.1)
        run: |
          cd proto/c-implant
          curl -sSfL -o "$RUNNER_TEMP/sqlite-amalgamation.zip" \
            https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip
          unzip -q "$RUNNER_TEMP/sqlite-amalgamation.zip" -d "$RUNNER_TEMP/sqlite"
          cp "$RUNNER_TEMP/sqlite/sqlite-amalgamation-3460100/sqlite3.c" \
             "$RUNNER_TEMP/sqlite/sqlite-amalgamation-3460100/sqlite3.h" .
          # Same sha256 as the amalgamation this repository is developed
          # against; bump both together with .gitignore'd sqlite3.c updates.
          echo "6c35bc5f7f85eac9c49928bacbb02bb694b547aabf69197e058cca245ad80e83  sqlite3.c" | sha256sum -c -
          grep -qE '#define SQLITE_VERSION +"3\.46\.1"' sqlite3.c
          grep -qE '#define SQLITE_VERSION_NUMBER +3046001' sqlite3.c
      - name: Cross-build the implant (warnings are errors)
        run: |
          cd proto/c-implant
          # The vendored SQLite amalgamation is not this repository's code, so it
          # is compiled once without -Werror: its warnings must not be able to
          # mask ours.
          x86_64-w64-mingw32-gcc -O1 -c sqlite3.c -o "$RUNNER_TEMP/sqlite3.o"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -Wno-unknown-pragmas \
            -DC2_HOST='"127.0.0.1"' -DC2_PORT=8000 -DBEACON_PATH='"/collect"' \
            -DSECRET_ID='"00000000000000000000000000000000"' -DSECRET_B64='"AA=="' \
            -DINTERVAL=3 -o "$RUNNER_TEMP/cbeacon-gate.exe" \
            beacon.c crypto_cng.c curve25519.c evade.c dns_transport.c "$RUNNER_TEMP/sqlite3.o" \
            -lwinhttp -lbcrypt -lpsapi -liphlpapi -lgdiplus -lgdi32 -luser32 -lole32 -ldnsapi -lws2_32
      - name: Assert the task matrix is in the binary
        run: |
          status=0
          for t in clipboard_get clipboard_set drives find portscan get_sleep_mode usb_enum usb_drop session_recon token_whoami; do
            if strings "$RUNNER_TEMP/cbeacon-gate.exe" | grep -q "$t"; then
              echo "ok: $t"
            else
              echo "missing from the built implant: $t"
              status=1
            fi
          done
          exit $status
      - name: DNS transport variant still compiles
        run: |
          cd proto/c-implant
          x86_64-w64-mingw32-gcc -fsyntax-only -Wall -Wextra -Werror \
            -DC2_TRANSPORT_DNS -DC2_DNS_DOMAIN='"t.example.com"' dns_transport.c
      # The embedded X25519 ladder is checked at implant startup against
      # compiler-baked Go-stdlib vectors; the same self-test runs here so a
      # broken ladder fails CI instead of refusing to run in the field.
      - name: X25519 self-test (host build)
        run: |
          cd proto/c-implant
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include "curve25519.h"' \
            'int main(void) { int rc = x25519_selftest(); printf("x25519_selftest=%d\n", rc); return rc == 0 ? 0 : 1; }' \
            > "$RUNNER_TEMP/x25519_main.c"
          cc -O2 -Wall -Wextra -Werror -I. "$RUNNER_TEMP/x25519_main.c" curve25519.c \
            -o "$RUNNER_TEMP/x25519_selftest"
          "$RUNNER_TEMP/x25519_selftest"
      - name: WASM example builds and runs (ABI v1)
        run: |
          cd examples/wasm/hello-report
          rm -f plugin.wasm
          CC=clang sh build.sh
          cd "$GITHUB_WORKSPACE"
          go run ./cmd/plugin-check examples/wasm/hello-report -run

  fuzz:
    name: Fuzz campaign
    # Seed corpora run as part of the normal test pass; the actual fuzzing only
    # happens on the weekly schedule (or manual dispatch) to keep PRs fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Fuzz beacon parsing
        run: go test ./internal/server/ -run='^$' -fuzz=FuzzBeaconRequestParsing -fuzztime=60s
      - name: Fuzz beacon identity decode
        run: go test ./internal/server/ -run='^$' -fuzz=FuzzDecodeBeaconIdentity -fuzztime=60s
      - name: Fuzz malleable transforms
        run: go test ./internal/malleable/ -run='^$' -fuzz=FuzzTransformChainDecode -fuzztime=60s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: |
            internal/server/testdata/fuzz/
            internal/malleable/testdata/fuzz/

  docker:
    name: Docker build + compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose files
        env:
          # The production overlay requires an explicit JWT secret and the
          # postgres profile interpolates DB_PASSWORD; both values are
          # throwaway validation-only strings, never real credentials.
          FORGEC2_JWT_SECRET: ci-validation-only-not-a-secret
          DB_PASSWORD: ci-validation-only-not-a-secret
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
          docker compose --profile postgres -f docker-compose.yml config > /dev/null
      - name: Build image
        run: docker build -t forgec2:ci .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Stage Wintun runtimes (Windows TUN embed)
        # The generator adds the wintun build tag only when the per-arch
        # runtime is staged in the source tree; fetching here keeps the smoke
        # build on the real tagged path (URL + SHA256 pinned in the script).
        run: bash scripts/fetch-wintun.sh
      - name: Real agent builds (windows amd64/386 + linux ELF + token stagers)
        # Everything in the supporting `for` loops is fast (~10s each). The
        # garble obfuscated path stays manual (needs $GOPATH/bin + takes ~3min).
        # TestSmokeTokenStagerMTLSFetch runs the built Linux stager against a
        # TLS server that requires client certificates: the end-to-end proof
        # that the embedded mTLS material actually reaches the handshake.
        run: |
          FORGEC2_SMOKE_BUILD=1 go test ./internal/payload/... -count=1 -timeout 15m -run 'TestSmokeGenerateWindowsEXE|TestSmokeWindowsPEOptions|TestSmokeLinuxELFSmoke|TestSmokeTokenStagerBuild|TestSmokeTokenStagerMTLSFetch' -v
      - name: Cross-compile agent for darwin (link-only gate)
        # darwin has no smoke test; keep a pure-Go link check so stub
        # regressions fail CI before a macOS generate is attempted.
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/agent-darwin" ./internal/payload/agent/
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/agent-darwin-arm64" ./internal/payload/agent/
      - name: Cross-compile agent for windows (stub + tagged Wintun)
        # Untagged: tun_stub.go path (no runtime bundled). Tagged amd64/arm64:
        # the per-arch //go:embed paths after the fetch step above. Tagged 386:
        # tun_wintun_unsupported.go keeps the honest no-runtime build compiling.
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/agent-windows-stub.exe" ./internal/payload/agent/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags wintun -o "$RUNNER_TEMP/agent-windows-amd64-wintun.exe" ./internal/payload/agent/
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -tags wintun -o "$RUNNER_TEMP/agent-windows-arm64-wintun.exe" ./internal/payload/agent/
          GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -tags wintun -o "$RUNNER_TEMP/agent-windows-386-wintun.exe" ./internal/payload/agent/
      - name: Agent module compile gate (reduced matrix)
        # TestAgentModuleExclusionBuilds stages a copy of the agent tree per
        # case, drops the excluded module's registry file (plus the exclusive
        # files the module fully owns), injects modules_excluded.go and runs a
        # real `go build` — the gate that turns a wrong ExclusiveFiles claim
        # into a red build instead of a broken payload. This reduced list
        # covers every drop shape on every push (max drop, the special
        # transports/slim path, and the exclusive-file-heavy modules); the full
        # matrix — all cases x every shipped target — is the local check before
        # changing agent_modules.go.
        env:
          FORGEC2_AGENT_MODULE_BUILD_TEST: "1"
          FORGEC2_AGENT_MODULE_BUILD_CASES: "core-only,no-transports_advanced,no-creds,no-screen,no-injection,no-evasion,no-lateral"
        run: go test ./internal/payload/ -run TestAgentModuleExclusionBuilds -count=1 -v

  # Operator-path runtime gate for the primary (Go) implant: a throwaway server
  # builds a real Linux agent through the generate API, the agent registers,
  # beacons and executes real tasks. The smoke job above proves the generator
  # produces binaries; this proves those binaries work end to end, including
  # ldflag-injected registration secrets and the task round trip.
  agent-e2e:
    name: Go agent E2E (generated ELF, real beacons + tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Generated-agent E2E (login -> listener -> generate -> beacon -> tasks)
        shell: pwsh
        run: ./scripts/e2e-agent-local.ps1 -WorkDir "$env:RUNNER_TEMP/e2e-agent" -KeepWork
      - name: Server log (failure only)
        if: failure()
        run: |
          log="$RUNNER_TEMP/e2e-agent/logs/forgec2.log"
          [ -f "$log" ] && tail -n 200 "$log" || echo "no server log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --new-from-rev=HEAD~ diffs the tip commit against its parent.
          fetch-depth: 2
      # golangci-lint v2: .golangci.yml declares `version: "2"`, and only
      # action v7+ can download/drive a v2 binary.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0  # pinned; bump deliberately after validating a new release
          # Ratchet, not a cleanup. Years of invalid config meant this gate
          # never ran, and the repo carries a checked-in ceiling instead
          # (scripts/lint-backlog.txt, enforced by the debt steps below).
          # Failing on all findings would block every push; instead only
          # issues on lines the tip commit changed fail here. The backlog
          # shrinks by paying it down, never by loosening this arg.
          args: --timeout=5m --new-from-rev=HEAD~

      # Full-tree debt record, one per analysis target. GOOS is pinned so the
      # numbers do not depend on the host: `windows` covers the windows-only
      # agent sources a native linux run would skip. --issues-exit-code=0
      # records the JSON instead of failing the step; scripts/check-lint-debt.sh
      # is the gate (mechanical linters at zero + ceiling only shrinks). The
      # action swallows golangci-lint's own text report, so the dump step
      # below prints both records: the JSON is the contract, the dump is the
      # audit trail.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.14.0
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0 --issues-exit-code=0 --output.json.path=lint-debt-windows.json
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: linux
        with:
          version: v2.14.0
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0 --issues-exit-code=0 --output.json.path=lint-debt-linux.json
      - name: Lint debt ceiling + mechanical linters at zero
        run: bash scripts/check-lint-debt.sh lint-debt-windows.json lint-debt-linux.json
      # The action captures golangci-lint's per-issue text output (only the
      # per-linter summary reaches the job log), so print both full records
      # here — that is what makes a count mismatch diagnosable without a rerun.
      - name: Lint debt audit trail (full finding list)
        run: |
          echo "=== windows target ==="
          jq -r '.Issues[] | "\(.FromLinter):\(.Pos.Filename):\(.Pos.Line): \(.Text)"' lint-debt-windows.json
          echo "=== linux target ==="
          jq -r '.Issues[] | "\(.FromLinter):\(.Pos.Filename):\(.Pos.Line): \(.Text)"' lint-debt-linux.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Supply-chain gate: fail on high/critical advisories. The tree is
      # kept clean via `npm audit fix` (non-breaking); moderate/low remain
      # advisory-only to avoid blocking on breaking-change upgrades.
      - name: npm audit (production high/critical + any critical)
        # Replaces a bare `npm audit --audit-level=high`, which failed on seven
        # high advisories inside shadcn's devDependency tool chain. Two of them
        # are unfixable today: braces' advisory covers <=3.0.3 and 3.0.3 is the
        # latest release, and upgrading shadcn adds a new advisory rather than
        # clearing them. npm also exits non-zero for low/moderate, so the old
        # --audit-level flag never actually gated at "high".
        #
        # The gate now pins what actually ships: production dependencies must be
        # clean at high/critical, and nothing anywhere may be critical. Dev-only
        # highs are listed but not blocking. See scripts/check-audit.mjs.
        run: npm run check:audit
      - name: Win7 shim mirror freshness
        run: node ../scripts/sync-win7shim.mjs --check
      - name: Docs freshness (command reference + capability matrix)
        run: |
          node ../scripts/gen-command-reference.mjs --check
          node ../scripts/gen-capability-matrix.mjs --check
      - run: npx tsc --noEmit
      - run: npm run lint
      # 9 static checks run concurrently via the bundled `check:pre` script
      # (package.json) instead of 9 sequential CI steps; `check:bundle` and the
      # post-build webdist freshness check stay separate to preserve granularity.
      - name: Static checks (css/tokens/i18n/paths/dialogs/openapi/perms/layout/readme, concurrent)
        run: npm run check:pre
      - run: npm test
      # Ratcheting floor: today 14.91% of statements in src/ (8473/56846).
      # It reads low because most uncovered code is page components no test
      # imports at all, not a missed branch inside a tested file. Raise this
      # whenever tests are added; lower it only as part of that same change,
      # never to make a regression pass. The Go job has an equivalent floor.
      - name: Frontend coverage floor
        run: |
          npm run test:coverage
          npm run check:coverage
      - run: npm run build
      # Both bundle gates read frontend/out, so they must run after the build.
      # They used to sit above `npm run build`, where they could only ever have
      # failed on ENOENT — a fresh CI checkout has no out/ directory. That was
      # invisible while the audit step above was failing first.
      - run: npm run check:bundle
      - name: Webdist freshness (internal/webdist/dist must match export)
        run: node ../scripts/check-webdist.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (static UI)
        run: npm run test:e2e

  live-e2e:
    name: Live UI e2e (real Go server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # The server embeds internal/webdist/dist, which the frontend job proves
      # byte-identical to frontend/out — so the real binary serves the real UI.
      - name: Build server
        run: go build -o "$RUNNER_TEMP/forgec2-server" ./cmd/server
      - name: Prepare e2e config (plain HTTP + seeded admin)
        run: |
          E2E_PASS="S1mokeC2-$(openssl rand -hex 8)-9z!Z"
          echo "$E2E_PASS" > "$RUNNER_TEMP/e2e-pass.txt"
          sed -e 's/^  tls_enabled:.*/  tls_enabled: false/' \
              -e 's/^  require_tls_for_auth:.*/  require_tls_for_auth: false/' \
              -e "s/^  default_password:.*/  default_password: $E2E_PASS/" \
              config.example.yaml > config.e2e.yaml
      - name: Start server
        run: |
          "$RUNNER_TEMP/forgec2-server" -config config.e2e.yaml > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health | grep -q ok; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-live-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright live (login + agents)
        working-directory: frontend
        env:
          FORGEC2_E2E_BASE: http://127.0.0.1:8000
          FORGEC2_E2E_USER: admin
        run: |
          export FORGEC2_E2E_PASS="$(cat "$RUNNER_TEMP/e2e-pass.txt")"
          npx playwright test --config=playwright.live.config.ts
      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - name: Stop server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" || true
