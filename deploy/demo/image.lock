# The canonical GHCR manifest the public demo runs.
#
# digest    - the GHCR manifest list: the pin a fresh `docker pull` resolves to
# platform - the linux/amd64 manifest inside that list
# config    - the image config digest, which is the container's image ID
# diff_id   - the uncompressed layer digests, in order
#
# verify-image.sh compares the running container against this file, so the pin
# stays checkable on a host that cannot reach the registry (the mirror that
# normally serves the demo has been answering 502, which is why the image is
# loaded from GHCR by hand and runs under a local tag).
#
# The build is the one with the patched Go standard library: go1.26.11 carries
# the fix for GO-2026-6859 (net/http, CVE-2026-97054).
