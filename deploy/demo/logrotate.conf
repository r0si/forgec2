# Demo gateway + container data log rotation.
# Install on the demo host (the directory is created by deploy.sh):
#
#   sudo install -m 0644 deploy/demo/logrotate.conf /etc/logrotate.d/forgec2-demo
#
# The container itself needs no entry: its json-file logs are capped by the
# compose `logging` options. This covers the nginx instance that runs outside
# a container (`nginx -c /opt/forgec2-demo/nginx.conf`).

/opt/forgec2-demo/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
