# Public, read-only HTTP demo gateway. Run as a standalone Nginx instance with
# `nginx -c /opt/forgec2-demo/nginx.conf`, leaving the host's Nginx untouched.
# The ForgeC2 process must bind only to 127.0.0.1:18000 and use an empty DB.
#
# Routing rule, mirroring the server's own dual-use contract: a request whose
# Accept names a machine format (application/json, text/event-stream) is an API
# call and goes to the backend; everything else is a page navigation and gets
# the static SPA from disk. The server's NoRoute handler answers non-JSON
# requests with beacon decoding, so the SPA must never be proxied.
user nobody nogroup;
worker_processes 1;
pid /run/forgec2-demo-nginx.pid;
error_log /opt/forgec2-demo/logs/nginx-error.log warn;

events { worker_connections 512; }

http {
include /www/server/nginx/conf/mime.types;
lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
default_type application/octet-stream;
access_log /opt/forgec2-demo/logs/nginx-access.log;
limit_req_zone $binary_remote_addr zone=forgec2_demo_login:10m rate=5r/m;

# 1 when the client asked for JSON or SSE (API call), 0 for page navigations.
map $http_accept $forgec2_api {
    default 0;
    "~application/json" 1;
    "~text/event-stream" 1;
}

server {
    listen 8000;
    server_name 43.143.162.139;

    root /opt/forgec2-demo/www;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The only public writes are authentication and session keep-alive. The
    # application already has its own login lockout; this edge limit adds a
    # second bounded layer. /api/auth/extend rotates the demo operator's own
    # session and changes no business data.
    location = /login {
        limit_except GET POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/login {
        limit_except POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Session termination and extension change no business data and must
    # remain available so public visitors can leave a shared browser clean and
    # keep a read-only session alive instead of being bounced to /login.
    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/auth/extend {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Beacon-facing endpoints are not operator reads. The SPA's language
    # setter is a POST to a cookie route the demo does not need.
    location ~ ^/api/v1/(collect|generate_204|th)$ { return 404; }
    location ~ ^/(submit|collect|generate_204|th|extc2/v1)(/|$) { return 404; }

    # Operator WebSocket: server->client broadcasts are tenant/permission
    # filtered in the hub, and the client->server path answers only ping/pong,
    # so a read-only observer can watch live updates without a write surface.
    location ~ ^/(ws|extc2/ws)(/|$) {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # AI run events stream over SSE; buffering would stall every token.
    location ~ ^/api/ai/runs/[^/]+/events {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Dual-use data routes: the console fetches them with Accept: JSON and the
    # backend answers with the envelope. Only reads are proxied; every write
    # is refused at the edge even before the permission layer sees it.
    #
    # Nginx forbids try_files inside an if, so the JSON branch is dispatched
    # through an error_page to a named location - the standard workaround, and
    # the reason the SPA never reaches the backend's beacon catch-all.
    location / {
        error_page 418 = @api;
        if ($forgec2_api = 1) {
            return 418;
        }
        try_files $uri $uri.html $uri/ /index.html;
    }

    location @api {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /health {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }
}
}
