# Public, read-only HTTP demo gateway.
#
# Run it as its own Nginx instance, leaving the host's Nginx untouched:
#
#   nginx -c /opt/forgec2-demo/nginx.conf
#
# The ForgeC2 backend is the container from docker-compose.yml: it binds only
# 127.0.0.1:18000, so this gateway is the only public listener (port 8000).
#
# Since the console is embedded in the server binary there is no static SPA
# directory to serve and no try_files fallback: everything that is a read is
# proxied, and the backend answers a browser navigation with the page shell and
# a dual-use route (Accept: application/json) with the envelope. A try_files
# fallback is what used to turn GET /loot into the SPA shell and GET /api/agents
# into a bevelled 404 for XHR callers.
#
# The edge is the first read-only layer: only GET/HEAD pass, except the three
# session endpoints below. The demo role has no write permission, so the
# handler layer refuses mutations too - this is defence in depth, not the only
# guard.
#
# The operator WebSocket is deliberately NOT proxied. A 404 is honest: the
# console eventually reports the live channel as unavailable instead of holding
# a command channel open to anonymous visitors. The read-only demo does not
# need live push; pages poll.
user nobody nogroup;
worker_processes 1;
pid /run/forgec2-demo-nginx.pid;
error_log /opt/forgec2-demo/logs/nginx-error.log warn;

events { worker_connections 512; }

http {
include /www/server/nginx/conf/mime.types;
lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
default_type application/octet-stream;
access_log /opt/forgec2-demo/logs/nginx-access.log;
limit_req_zone $binary_remote_addr zone=forgec2_demo_login:10m rate=5r/m;

server {
    listen 8000;
    server_name 43.143.162.139;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The only public writes are authentication and session keep-alive. The
    # application already has its own login lockout; this edge limit adds a
    # second bounded layer. /api/auth/extend rotates the visitor's own session
    # and changes no business data.
    location = /login {
        limit_except GET POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/login {
        limit_except POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Session termination and extension change no business data and must
    # remain available so public visitors can leave a shared browser clean and
    # keep a read-only session alive instead of being bounced to /login.
    location = /api/logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/auth/extend {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Beacon-facing endpoints are not operator reads. Payload downloads and
    # phishing capture surfaces are implant/credential paths the demo never
    # needs.
    #
    # Only the phishing LANDING and OAuth-capture paths are blocked: /phishing
    # itself is the read-only console page (campaigns.read) whose data comes
    # from /phishing/templates|campaigns|captures. A blanket ^/phishing prefix
    # answered 404 for the page and left a nav entry every custom role with
    # campaigns.read could see and could not open.
    location ~ ^/api/v1/(collect|generate_204|th)$ { return 404; }
    location ~ ^/(submit|collect|generate_204|th|extc2/v1)(/|$) { return 404; }
    location ^~ /phishing/l/ { return 404; }
    location ^~ /phishing/oauth/ { return 404; }
    location ~ ^/payloads(/|$) { return 404; }

    # The operator WebSocket is deliberately not proxied: no command channel is
    # held open to anonymous visitors. 404 (not 401/400) so the console treats
    # the channel as absent instead of bouncing through a handshake.
    location ~ ^/(ws|extc2/ws)(/|$) { return 404; }

    # AI run events stream over SSE; buffering would stall every token.
    location ~ ^/api/ai/runs/[^/]+/events {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else is a read. The console, its assets and every dual-use
    # JSON route go to the embedded server, which owns both the SPA and the API
    # contract.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        # No Upgrade passthrough: a WebSocket handshake must not reach the
        # backend through the catch-all.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }
}
}
