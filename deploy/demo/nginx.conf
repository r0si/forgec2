# Public, read-only HTTP demo gateway. Run as a standalone Nginx instance with
# `nginx -c /opt/forgec2-demo/nginx.conf`, leaving the host's Nginx untouched.
# The ForgeC2 process must bind only to 127.0.0.1:18000 and use an empty DB.
user nobody nogroup;
worker_processes 1;
pid /run/forgec2-demo-nginx.pid;
error_log /opt/forgec2-demo/logs/nginx-error.log warn;

events { worker_connections 512; }

http {
include /www/server/nginx/conf/mime.types;
lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
default_type application/octet-stream;
access_log /opt/forgec2-demo/logs/nginx-access.log;
limit_req_zone $binary_remote_addr zone=forgec2_demo_login:10m rate=5r/m;

server {
    listen 8000;
    server_name 43.143.162.139;

    root /opt/forgec2-demo/www;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The only public write is authentication. The application already has
    # its own login lockout; this edge limit adds a second bounded layer.
    location = /login {
        limit_except GET POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/login {
        limit_except POST { deny all; }
        limit_req zone=forgec2_demo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Session termination changes no business data and must remain available
    # so public visitors can clear the observer cookie from a shared browser.
    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # These GET endpoints are beacon-facing, not operator reads.
    location ~ ^/api/v1/(collect|generate_204|th)$ { return 404; }
    location ~ ^/(ws|extc2/ws)(/|$) { return 404; }

    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
        proxy_set_header Accept application/json;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location = /health {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $http_host;
    }

    # Serve the built SPA from disk. Unknown paths never reach the backend's
    # catch-all beacon handler, and WebSocket upgrades are never proxied.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri.html $uri/ /index.html;
    }
}
}
