openapi: 3.0.3
info:
  title: ForgeC2 Command & Control API
  description: |
    ForgeC2 is a professional-grade command and control framework for red team operations.

    ## Authentication
    Most endpoints require a session cookie (`forgec2_session`) from `POST /login`.
    Unauthenticated access to `/api/*` returns **JSON 401** (`{success:false,error:...}`), not HTML.

    ## CSRF
    State-changing requests need double-submit CSRF: cookie `forgec2_csrf` + header `X-CSRF-Token`.

    ## Spec quality (honest)
    - Route inventory is kept near-complete (CI coverage 鈮?0%, stale=0).
    - **Core operator paths** (health, agents, modules, listeners, dashboard, deploy)
      include request/response schemas; many secondary routes remain summary-only.
    - Dual-use paths (e.g. `GET /agents`) serve SPA HTML or JSON depending on Accept/auth.
    - `/debug/pprof/*` is intentionally omitted (disabled by default).

    ## Rate Limiting
    - Login: Limited attempts with lockout
    - API: Token bucket rate limiting per user

    ## Permissions
    Role-based access control (custom roles supported):
    - **admin**: Full control (all permissions)
    - **user**: Standard operator permissions (agents, tasks, credentials, limited settings)

  version: 2.7.1
  contact:
    name: ForgeC2 Support
    email: support@forgec2.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server (default port)
  - url: https://c2.example.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Agents
    description: Implant/Agent management and operations
  - name: Listeners
    description: C2 listener configuration and management
  - name: Tasks
    description: Task management and execution
  - name: Credentials
    description: Credential vault management
  - name: Files
    description: File operations on agents
  - name: Users
    description: User management (admin only)
  - name: Settings
    description: System configuration and settings
  - name: Audit
    description: Audit log access
  - name: Automation
    description: Automation rules and webhooks
  - name: Monitor
    description: System monitoring and alerts
  - name: BOF
    description: Beacon Object File management
  - name: Plugins
    description: Plugin management
  - name: Chat
    description: Operator chat system
  - name: Tokens
    description: Windows token impersonation
  - name: SOCKS
    description: SOCKS proxy relay
  - name: Lateral Movement
    description: Lateral movement operations
  - name: Privilege Escalation
    description: Privilege escalation operations
  - name: Scanner
    description: Network scanning
  - name: Timeline
    description: Event timeline
  - name: Report
    description: Report generation
  - name: Infrastructure
    description: Infrastructure management
  - name: Generate
    description: Payload generation
  - name: Templates
    description: Command templates
  - name: Collaboration
    description: Multi-user collaboration
  - name: Phishing
    description: Phishing templates, campaigns, and capture
  - name: Intel
    description: BloodHound and intelligence integrations
  - name: Integrations
    description: External integrations (Slack, Discord, Email, webhooks)

paths:
  /login:
    get:
      tags: [Authentication]
      summary: Login page (SPA)
      operationId: loginPage
      responses:
        '200':
          description: Login HTML shell
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and establish session cookie
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin
                remember_me:
                  type: string
                  enum: [on, ""]
                  description: Remember me option
      responses:
        '302':
          description: Login successful (redirect to dashboard)
          headers:
            Set-Cookie:
              schema:
                type: string
              description: forgec2_session cookie
        '200':
          description: Login failed (returns login page with error)
          content:
            text/html:
              schema:
                type: string

  /logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Terminate current session
      operationId: logout
      security:
        - SessionCookie: []
      responses:
        '302':
          description: Logout successful (redirect to login)

  /api/auth/extend:
    post:
      tags: [Authentication]
      summary: Extend session
      description: Re-issue the session JWT and replace the session cookie
      operationId: extendSession
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Session extended (Set-Cookie rotated)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags: [Monitor]
      summary: Health check
      description: Liveness probe 鈥?no authentication required
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents:
    get:
      tags: [Agents]
      summary: List all agents
      description: Retrieve a paginated list of all agents with optional filters
      operationId: listAgents
      security:
        - SessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by hostname, username, or IP
        - name: status
          in: query
          schema:
            type: string
            enum: [online, stale, offline]
          description: Filter by agent status
        - name: os
          in: query
          schema:
            type: string
          description: Filter by operating system
        - name: linked
          in: query
          schema:
            type: string
            enum: [direct, chained]
          description: Filter by P2P linkage (direct = no parent, chained = has parent)
        - name: group
          in: query
          schema:
            type: string
            enum: [host]
          description: >-
            `host` groups the rows by hostname, so several agents on one machine collapse into one row. Any other value lists
            agents individually.
        - name: tag_id
          in: query
          schema:
            type: integer
          description: Only agents carrying this tag
        - name: include_screenshots
          in: query
          schema:
            type: string
          description: >-
            Include the screenshot count per agent. Off by default because it costs a filesystem walk per host, which is not what
            a list request should spend its time on.
        - name: include_unlinked
          in: query
          schema:
            type: string
          description: Include agents with no parent in the chained view; ignored when `linked=direct`
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: >-
            csv returns the fleet as a file (ID, Hostname, IP, OS, Username, Status, Protocol, Last Seen, Engagement) with
            X-Task-Export-Scope and X-Export-Truncated when the page is not the whole fleet. The per-agent
            /api/agents/{id}/export packages ONE host, which is a different document from the inventory.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
          description: Items per page
        - name: sort_key
          in: query
          schema:
            type: string
            enum: [hostname, username, os, ip, last_seen, version, status]
            default: last_seen
          description: Sort by column (status orders by derived online/stale/offline)
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/Agent'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agents/unlinked:
    get:
      tags: [Agents]
      summary: List unlinked agents
      description: Retrieve agents that are not linked (direct connection only)
      operationId: listUnlinkedAgents
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get agent detail page
      description: Render agent detail HTML page
      operationId: getAgentDetailPage
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent detail page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Agent not found

    delete:
      tags: [Agents]
      summary: Delete agent
      description: Remove an agent from the system
      operationId: deleteAgent
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{id}/kill:
    post:
      tags: [Agents]
      summary: Kill agent
      description: Send kill command to agent
      operationId: killAgent
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kill command sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/note:
    post:
      tags: [Agents]
      summary: Update agent note
      description: Update notes for an agent
      operationId: updateAgentNote
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /agents/{id}/tasks:
    get:
      tags: [Tasks, Agents]
      summary: List agent tasks
      description: Retrieve all tasks for a specific agent
      operationId: listAgentTasks
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
          description: Filter by task status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agents/{id}/tasks/{taskId}:
    get:
      tags: [Tasks, Agents]
      summary: Get task status
      description: Retrieve detailed information about a specific task
      operationId: getTaskStatus
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{id}/tasks/{taskId}/cancel:
    post:
      tags: [Tasks, Agents]
      summary: Cancel task
      description: Cancel a pending task
      operationId: cancelTask
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /agents/{id}/task/{taskId}/rerun:
    post:
      tags: [Tasks, Agents]
      summary: Rerun task
      description: Re-execute a completed or failed task
      operationId: rerunTask
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task requeued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/batch:
    post:
      tags: [Agents]
      summary: Batch command
      description: Send command to multiple agents simultaneously
      operationId: batchCommand
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_ids, command]
              properties:
                agent_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                command:
                  type: string
                type:
                  type: string
                  default: shell
      responses:
        '200':
          description: Batch commands dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          tasks:
                            type: array
                            items:
                              type: object
                              properties:
                                agent_id:
                                  type: string
                                task_id:
                                  type: integer
  /agents/{id}/command:
    post:
      tags: [Agents]
      summary: Execute shell command
      description: Execute a shell command on the agent
      operationId: executeCommand
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: Command to execute
                shell:
                  type: string
                  description: Shell to use (cmd.exe, powershell.exe, /bin/bash, etc.)
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: Command to execute
                shell:
                  type: string
                  description: Shell to use (cmd.exe, powershell.exe, /bin/bash, etc.)
      responses:
        '200':
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/screenshot:
    get:
      tags: [Agents]
      summary: Get latest agent screenshot
      operationId: getAgentScreenshot
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Screenshot image or metadata
    post:
      tags: [Agents]
      summary: Take screenshot
      description: Capture a screenshot from the agent
      operationId: requestScreenshot
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Screenshot task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/ps:
    post:
      tags: [Agents]
      summary: List processes
      description: List running processes on the agent
      operationId: requestPS
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Process list task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/upload:
    post:
      tags: [Files, Agents]
      summary: Push a file onto the implant
      description: Operator-to-implant push. Multipart file is written on the next beacon. Use target_path (path is accepted as an alias).
      operationId: uploadFile
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                target_path:
                  type: string
                  description: Destination file path on the implant
                path:
                  type: string
                  description: Alias for target_path
      responses:
        '200':
          description: Upload task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/download:
    post:
      tags: [Files, Agents]
      summary: Instruct the implant to fetch a URL
      description: Queues a download_url-style task. The implant fetches `url` onto `path`. This is not operator exfil 鈥?use POST /agents/{id}/files/upload then GET /agents/{id}/files/exfil/{filename}.
      operationId: downloadFile
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [url, path]
              properties:
                url:
                  type: string
                  description: HTTP(S) URL the implant should fetch
                path:
                  type: string
                  description: Destination path on the implant
      responses:
        '200':
          description: Download task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/files/ls:
    post:
      tags: [Files, Agents]
      summary: List directory
      description: List files in a directory on the agent
      operationId: listDir
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: "Directory path (default: C:\\)"
      responses:
        '200':
          description: Directory list task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/files/delete:
    post:
      tags: [Files, Agents]
      summary: Delete file
      description: Delete a file on the agent
      operationId: deleteFile
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: File path to delete
      responses:
        '200':
          description: Delete task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/files/read:
    post:
      tags: [Files, Agents]
      summary: Read file
      description: Read a file's contents from the agent
      operationId: readFile
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: File path to read
      responses:
        '200':
          description: Read task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/socks_relay/status:
    get:
      tags: [SOCKS, Agents]
      summary: Get SOCKS relay status
      description: Check SOCKS relay status for an agent
      operationId: getSocksRelayStatus
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SOCKS status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          active:
                            type: boolean
                          port:
                            type: integer
  /agents/{id}/socks_relay/start:
    post:
      tags: [SOCKS, Agents]
      summary: Start SOCKS relay
      description: Start SOCKS5 proxy relay through agent
      operationId: startSocksRelay
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SOCKS relay started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          port:
                            type: integer
  /agents/{id}/socks_relay/stop:
    post:
      tags: [SOCKS, Agents]
      summary: Stop SOCKS relay
      description: Stop SOCKS5 proxy relay
      operationId: stopSocksRelay
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SOCKS relay stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /socks/sessions:
    get:
      tags: [SOCKS]
      summary: List SOCKS sessions
      description: List all active SOCKS relay sessions
      operationId: listSocksSessions
      security:
        - SessionCookie: []
      responses:
        '200':
          description: SOCKS sessions list
