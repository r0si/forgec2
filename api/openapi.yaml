                      data:
                        $ref: '#/components/schemas/TaskResponse'
  /agents/{id}/token/steal:
    post:
      tags: [Tokens, Agents]
      summary: Steal token
      description: Steal a token from a process
      operationId: tokenSteal
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
