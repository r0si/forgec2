  /api/notification-routes/stats/reset:
    post:
      tags: [Notifications]
      summary: Clear the delivery counters
      description: >-
        The counters are an operational indicator, so they must be clearable: a route that failed for a week and was then
        fixed keeps a red "failing" state forever otherwise, and an indicator that can only get worse is one operators
        learn to ignore. Clearing one route (`?id=7`) leaves the rest alone; omitting `id` clears every counter. An
        unknown route is a 404 rather than a silent no-op, because "the badge was reset" and "the id was a typo" must not
        look the same. Both forms are audited as `notification_stats_reset` - "the failures disappeared" is exactly the
        change someone will want explained later.
      operationId: resetNotificationRouteStats
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: query
          description: Route to clear; omit to clear every counter
          schema: {type: integer}
      responses:
        '200':
          description: How many counters were removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      cleared: {type: integer}
                      scope: {type: string, enum: [route, all]}
                      route_id: {type: integer}
        '400': {description: The id is not a number}
        '404': {description: No such route}
  /api/notification-routes/preview:
    post:
      tags: [Notifications]
      summary: Would a notification reach anyone
      description: >-
        Applies the sender's own rules to a candidate notification and reports each route's verdict, without
        persisting or delivering anything. The failure it replaces is quiet in the worst way: notifications are
        persisted first and fanned out in goroutines, so a route filtered out by severity, a disabled route and
        a route with an unusable target all look identical from the console - a notification that exists and
        reached nobody. Each route reports `would_deliver` plus the precise reason it would not (disabled,
        severity below the route minimum, no bot token for Telegram, no or invalid target URL), and the summary
        says how many of the configured routes would deliver - including zero, which is the case worth knowing
        before a real beacon fails.
      operationId: previewNotification
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, description: What a route's message shows}
                message: {type: string}
                severity: {type: string, enum: [info, warning, critical], default: info}
                type: {type: string}
      responses:
        '200':
          description: One verdict per route plus delivery counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      severity: {type: string}
                      would_deliver: {type: integer}
                      total_routes: {type: integer}
                      no_route_at_all: {type: boolean, description: No routes are configured at all}
                      routes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            channel: {type: string}
                            enabled: {type: boolean}
                            min_severity: {type: string}
                            would_deliver: {type: boolean}
                            reason: {type: string}
        '400':
          description: Missing title, malformed body or unknown severity
  /api/notification-routes:
    get:
      tags: [Notifications]
      summary: List notification delivery routes
      operationId: listNotificationRoutes
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: >-
            Routes plus delivery counters. `stats` maps a route id to `{delivered, failed, state, last_attempt,
            last_error_signature,
            last_error}`, where `state` is one of unused/delivering/degraded/failing and `last_error` has any webhook URL
            redacted - the path of a webhook is a credential - and `last_error_signature`, the same normalisation the
            task-failure report uses (paths, ids and digits collapsed), so two routes failing for one reason group together. `stats_since` is always "process start": the counters are
            operational indicators kept in memory, so they answer "is this route still working" without being confused
            for an audit record.
    post:
      tags: [Notifications]
      summary: Create a notification route (Discord/Telegram/webhook)
      operationId: createNotificationRoute
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationRouteInput'}
      responses:
        '200': {description: Route created}
  /api/notification-routes/{id}:
    put:
      tags: [Notifications]
      summary: Update a notification route
      operationId: updateNotificationRoute
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationRouteInput'}
      responses:
        '200': {description: Route updated}
    delete:
      tags: [Notifications]
      summary: Delete a notification route
      operationId: deleteNotificationRoute
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Route deleted}
  /api/notification-routes/{id}/test:
    post:
      tags: [Notifications]
      summary: Send one test notification through a route
      description: >-
        The button whose whole purpose is "tell me whether this route works", answering with the delivery outcome: the
        channel, the target host (never the full URL - a Discord webhook path is a credential) and, on failure, the
        reason from the sender. A bare "delivery failed" leaves an operator guessing between a wrong URL, a revoked
        token and a blocked egress rule. A disabled route is refused with 409 rather than tested, since it is never used
        in production; tests are rate-limited per route (10 s, Retry-After on 429) because a retrying script must not
        become a flood against Discord, Telegram or a customer webhook; and every attempt that reaches the sender is
        audited as notification_route_test with its outcome.
      operationId: testNotificationRoute
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The delivery outcome, with the reason when it failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      route_id: {type: integer}
                      channel: {type: string}
                      target: {type: string, description: Host only; the path may hold a credential}
                      delivered: {type: boolean}
                      error: {type: string, description: The sender reason, present when delivered is false}
        '404': {description: No such route}
        '409': {description: The route is disabled}
        '429': {description: This route was tested moments ago; see Retry-After}
