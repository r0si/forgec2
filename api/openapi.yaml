      description: Readiness for load balancers - no authentication required
      operationId: ready
      parameters:
        - name: download
          in: query
          description: >-
            Any value turns the snapshot into a file: Content-Disposition attachment ready_<instant>.json, an
            X-Export-Scope of "probe at <RFC3339>", and a probed_at field in the body. A probe result is read once and
            pasted into a ticket, and "what did it say at 02:14" is not answerable from a tab that has since re-polled.
          schema: {type: string}
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                allOf:
