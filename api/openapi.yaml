  /api/playbooks/runs:
    post:
      tags: [Automation]
      summary: Create a playbook run
      description: >-
        Stores a validated run. `Normalise` refuses what can never finish - a cycle, a duplicate id, a dangling dependency - so an
        impossible playbook cannot be stored for every later report to inherit. The run starts `blocked` when any step needs
        approval, because waiting for a person is a state, not an absence of progress.
      operationId: createPlaybookRun
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      title: {type: string}
                      needs: {type: array, items: {type: string}}
                      approval: {type: boolean}
      responses:
        '200': {description: The run, its state and the ready set}
        '400': {description: The definition cannot finish, or the body is malformed}
  /api/playbooks/runs/{id}/history:
    get:
      tags: [Playbooks]
      summary: The audited history of one run
      description: >-
        The transitions of one run, oldest first, read from the **audit log** rather than kept separately - every create and transition is
        already audited. "Who advanced this run, and when" is what a handover or an incident review asks about a checklist, and answering it
        by searching the global audit page is how the two get separated. Each entry carries `entry_hash` so the rows can be matched
        against `/api/audit/export`; this is a convenience view, not a second source of truth.
      operationId: getPlaybookRunHistory
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: The run's audited entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      run_id: {type: integer}
                      count: {type: integer}
                      note: {type: string}
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            action: {type: string}
                            user: {type: string}
                            details: {type: string}
                            success: {type: boolean}
                            at: {type: string, format: date-time}
                            entry_hash: {type: string, description: Matches the row in the audit export}
        '404': {description: No such run - an empty history would read as "nothing happened yet"}
  /api/playbooks/runs/{id}/transitions:
    post:
      tags: [Automation]
      summary: Record a transition on a playbook run
      description: >-
        Applies `start`, `succeed`, `fail`, `skip` or `approve` to one step **through the state machine in `internal/playbook`** -
        this handler never decides whether a step may start. A transition the state refuses answers **409**, because the request is
        well formed and the state is the reason; an unknown `action` is **400** rather than a guess. **Nothing is dispatched:** this
        endpoint records what an operator did, so an empty result is unfinished work rather than a clean one. Both this and creation
        are audited (`playbook_run_create`, `playbook_run_transition`).
      operationId: transitionPlaybookRun
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, action]
              properties:
                step: {type: string}
                action: {type: string, enum: [start, succeed, fail, skip, approve]}
                reason: {type: string}
      responses:
        '200': {description: The run after the transition, with the recomputed ready set}
        '400': {description: Missing step, unknown action, or a malformed body}
        '404': {description: No such run in the caller's tenant}
        '409': {description: The state refuses this transition}

    get:
      tags: [Automation]
      summary: List playbook runs
      description: >-
        Read-only view of structured playbook runs. The transitions live in `internal/playbook` and are exhaustive there; this
        endpoint persists what that package produced and renders it. `settled`/`total` come from the stored steps, so a list can
        show progress without a reader opening each run. `?state=` filters on the value the machine computed at save time.
      operationId: listPlaybookRuns
      security: [{SessionCookie: []}]
      parameters:
        - name: state
          in: query
          description: draft|blocked|running|failed|complete
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv returns the checklist as a file with one row per run: progress, what waits for a person, and what stalled. A handover
            that carries tasks.csv and audit.ndjson but not this leaves the receiver rebuilding "where the structured path stood" from
            screenshots.
          schema: {type: string, enum: [json, csv], default: json}
        - name: attention
          in: query
          description: >-
            `1` keeps only the runs that are waiting for a HUMAN - an approval step that has not been approved - because "blocked" alone
            makes the reader open each run to learn whether the blocker is a person or a dependency. Filtering happens after the steps are
            decoded, since blocked is a property of a step rather than of the row.
          schema: {type: string, enum: ["1"]}
      responses:
        '200':
          description: Runs, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      count: {type: integer}
                      runs:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            state: {type: string}
                            created_by: {type: string}
                            updated_at: {type: string}
                            settled: {type: integer}
                            total: {type: integer}
                            blocked_steps:
                              type: array
                              description: >-
                                Steps waiting for a HUMAN (an approval step that has not been approved). On the list on purpose: a run that
                                only says "blocked" makes the reader open each one to learn whether the blocker is a person or a
                                dependency, and those need different people.
                              items: {type: string}
                            next_step:
                              type: string
                              description: The first step that may run now, empty when nothing can
                            running_steps:
                              type: array
                              description: Steps currently in progress
                              items: {type: string}
                            stalled:
                              type: boolean
                              description: >-
                                A running step untouched for more than 12 hours. The state machine is right to call the run "running", so nothing
                                is wrong and nothing draws attention - which is why the flag exists. attention=1 keeps these runs too.
                      stall_grace_seconds: {type: integer}
  /api/playbooks/runs/{id}:
    get:
      tags: [Automation]
      summary: One playbook run, with what may run next
      description: >-
        The run, its steps, and `ready` - the steps that may start now, computed from the current state rather than stored, because
        a stored copy would be a second answer that drifts the first time a transition forgets to update it. An approval step is
        **absent** from `ready` until it is approved: waiting for a person is a state, not progress.
      operationId: getPlaybookRun
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: The run, its steps and the ready set}
        '400': {description: The id is not a number}
        '404': {description: No such run in the caller's tenant}
  /api/stats/tasks/queue:
    get:
      tags: [Statistics]
      summary: Which beacon is backed up
      description: >-
        Per-beacon backlog: pending and running counts, and the age of the OLDEST pending task. The question this answers is not
        "how many tasks failed" but **which host is not consuming work**, and that is a queue question - the console otherwise
        shows a stuck beacon as "pending" one page at a time. A queue is called **stalled** when its oldest pending task is older
        than the beacon's own sleep interval plus a **two-minute** grace period: a beacon sleeping five minutes is not stalled at
        four, and a stalled queue means the beacon is not polling rather than a command being slow. Rows are ordered by queued
        work, then by age, then by id, so two runs over the same data agree.
      operationId: taskQueueStats
      security:
        - SessionCookie: []
      parameters:
        - name: engagement
          in: query
          description: >-
            Scope the queue to one exercise (numeric id) or, with `none`, to hosts in no exercise - the same scope the failure,
            shape and duration reports take, so "which host in THIS exercise is not draining" is answerable. Echoed back as
            `engagement` so a caller can tell a scoped answer from an unscoped one.
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv returns the backlog as a file (Agent ID, Hostname, Pending, Running, Oldest pending, Sleep, Stalled) with
            X-Task-Export-Scope. Every other stats report exports; the backlog is the one an operator attaches to "why is this host
            not responding", so it should not be the exception.
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: The backlog, busiest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      queued: {type: integer}
                      stalled_agents: {type: integer}
                      stall_grace_seconds: {type: integer}
                      note: {type: string}
                      agents:
                        type: array
                        items:
                          type: object
                          properties:
                            agent_id: {type: string}
                            hostname: {type: string}
                            pending: {type: integer}
                            running: {type: integer}
                            oldest_pending_seconds: {type: integer}
                            sleep_seconds: {type: integer}
                            stalled: {type: boolean}
  /api/stats/failures/signatures:
    get:
      tags: [Stats]
      summary: What shape of failure dominates, across tasks and notifications
      description: >-
        The question that comes after the reason breakdown: **is this four separate 401s or one expired token?** Every failed
        task in the window is grouped by its **normalised shape** (paths, ids and digits collapsed) with the reason codes that
        contributed and one example, and notification route failures are grouped by the **same** normalisation after the
        message is redacted - so a signature means the same thing in both halves and in a UI. Both lists are capped at ten
        rows and sorted by count, then by signature, so successive polls can be compared.
      operationId: failureSignatures
      security:
        - SessionCookie: []
      parameters:
        - name: since
          in: query
          description: Window for the task half, e.g. 24h or 7d (default 7d)
          schema: {type: string, default: 7d}
        - name: engagement
          in: query
          description: >-
            Scope the task half to one exercise (numeric id) or, with `none`, to hosts in no exercise - the same scope the
            failure report takes, so the two reports cannot disagree about which failures they are looking at. Echoed back as
            `engagement` so a caller can tell a scoped answer from an unscoped one.
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv returns the task half as a downloadable file (Signature, Count, Agents, Top Agent, Top Agent Host, Top Agent Failures, Reasons, Example) - every other list in the
            console can be exported, and this is the analysis an operator pastes into a review. The notification half is left
            out because it is process state rather than a window. The file carries `X-Task-Export-Scope` like the other exports.
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: The dominant shapes, tasks and notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      since: {type: string}
                      engagement: {type: string, description: The scope that was applied, empty when unscoped}
                      signature_kind:
                        type: string
                        description: >-
                          Which of this system's four "signatures" these rows are: a **failure shape** - normalised error text
                          with paths, ids and digits collapsed, and no cryptography at all. Stated in the response because the
                          word is overloaded and a reader who takes it for a keyed signature believes the wrong thing.
                      task_failures: {type: integer}
                      note: {type: string}
                      rerun:
                        type: object
                        description: >-
                          What to do with a row: `POST /api/tasks/rerun-by-signature` re-dispatches the failed tasks that share
                          one shape, and the row signature IS the request body. Carried in the answer so a client does not have
                          to know the second endpoint exists.
                        properties:
                          method: {type: string}
                          path: {type: string}
                          body:
                            type: object
                          note: {type: string}
                      task_signatures:
                        type: array
                        items:
                          type: object
                          properties:
                            signature: {type: string}
                            count: {type: integer}
                            agents_affected:
                              type: integer
                              description: >-
                                Distinct hosts that produced this shape - eleven rows from one beacon is a flaky link, eleven from
                                eleven beacons is a bad command, and the count alone cannot tell them apart. Matches the field
                                failures.json reports, so the live view and the handover agree.
                            top_agent:
                              type: string
                              description: >-
                                The host that produced the most of this shape - "one host" only becomes actionable once it is
                                named, and the next question is always which beacon is the flaky one.
                            top_agent_host:
                              type: string
                              description: >-
                                The hostname for top_agent. An id is not actionable on its own - the console lists hosts by
                                name, and the next step for an operator is to open that host. Resolved for the few rows
                                returned, not per failure.
                            top_agent_failures:
                              type: integer
                              description: How many of this shape the top agent produced
                            reasons:
                              type: array
                              items: {type: string}
                            sample: {type: string}
                      notification_signatures:
                        type: array
                        items:
                          type: object
                          properties:
                            signature: {type: string}
                            routes:
                              type: array
                              description: Route ids that share this shape
                              items: {type: string}
        '400':
          description: Invalid since
  /api/tasks/rerun-by-signature:
    post:
      tags: [Tasks]
      summary: Re-run the failures that share one shape
      description: >-
        After fixing a link, the useful action is "re-run the timeouts" - not "re-run every failure on this host", which would
        re-dispatch permission errors that will fail again, and not forty manual clicks. The selector is the **same
        normalisation** the failure report and the handover bundle use, so the row an operator is looking at and the rows this
        re-dispatches are the same set by construction. Tasks that cannot be re-run are excluded and reported, and a
        signature that matches nothing answers **200 with a note** rather than looking like a failed request. Bounded by
        `limit` (default and maximum 100) and audited as `tasks_rerun_by_signature`.
      operationId: rerunTasksBySignature
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: {type: string, description: A row from GET /api/stats/failures/signatures}
                since: {type: string, default: 24h}
                limit: {type: integer, description: Maximum tasks to re-dispatch (default and cap 100)}
      responses:
        '200':
          description: What matched, what was queued, and why anything was skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      signature: {type: string}
                      since: {type: string}
                      matched: {type: integer}
                      queued: {type: integer}
                      task_ids:
                        type: array
                        items: {type: integer}
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            type: {type: string}
                            reason: {type: string}
                      note: {type: string, description: Present when nothing matched}
        '400': {description: Missing signature or an invalid window}
  /api/stats/tasks/failures:
    get:
      tags: [Stats]
      summary: Why tasks failed, grouped by reason, type or agent
      description: >-
        "Twelve tasks failed this week" is not actionable; "nine timed out and two were denied by Defender" is. The error
        text is already stored on every failed task, and this classifies it into a short, transparent list of reason codes
        - the first matching pattern wins, and everything unmatched is collected as `other` **with an example**, so the
        report never hides a category it could not name. `since` accepts the dashboard's relative form (`24h`, `7d`);
        `group_by` switches the same rows between `reason` (default), `type`, `agent` and `engagement` - the last one is the after-action question, and hosts outside an exercise are bucketed as `none` rather than dropped. Each bucket carries `count`,
        `sample` (the first error text, truncated) and `distinct_types`, because a reason spread across many task types is
        systemic while one concentrated in a single type is that type's problem. The sample is capped at 5000 rows; when it
        is reached the response says `truncated: true` rather than implying a complete picture.
      operationId: taskFailureStats
      security:
        - SessionCookie: []
      parameters:
        - name: since
          in: query
          description: Window, e.g. 24h or 7d (default 7d)
          schema: {type: string, default: 7d}
        - name: group_by
          in: query
          schema: {type: string, enum: [reason, type, agent, engagement], default: reason}
        - name: engagement
          in: query
          description: >-
            Scope the report to one exercise (numeric id) or, with `none`, to hosts in no exercise. The after-action question is
            usually about ONE exercise, and answering it by exporting and filtering by hand is how the wrong window gets
            reviewed.
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv returns the breakdown as a downloadable file (Key, Count, Distinct types, Example) with X-Task-Export-Scope and
            X-Export-Truncated when the 5000-row sample cut the answer. A truncated sample must not read as a complete one just
            because it left as a file.
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: Buckets, most common first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      since: {type: string}
                      group_by: {type: string}
                      failed: {type: integer}
                      retried:
                        type: integer
                        description: >-
                          Tasks in the window that ran more than once because an automatic retry re-issued a failed read-only
                          enumeration. A window with many retries points at the LINK rather than the task - and it is invisible
                          in a list of reasons, because every retried task ended up somewhere else in the report.
                      retry_note: {type: string, description: One sentence explaining the retry count}
                      truncated: {type: boolean}
                      note: {type: string}
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            key: {type: string}
                            count: {type: integer}
                            sample: {type: string}
                            distinct_types: {type: integer}
                      other_signatures:
                        type: array
                        description: >-
                          Present when `group_by=reason`: the errors nobody classified, grouped by their own normalised
                          shape (paths, hex runs and digits collapsed). "other: 7" is a dead end; "3 of them say RPC
                          server unavailable" is a lead. Capped at the top five shapes.
                        items:
                          type: object
                          properties:
                            signature: {type: string}
                            count: {type: integer}
                            sample: {type: string}
        '400':
          description: Invalid since or group_by
  /api/stats/builds/failures:
    get:
      tags: [Stats]
      summary: Why builds failed, grouped by cause
      description: >-
        A build log row already carries its failure text, so this report **classifies the history** with the same helper that produces
        `error_hint` for a single build - the property that matters, since "six failed with toolchain_missing" (an environment problem)
        and "six with compile_error" (a code problem) send an operator to different places, and a report that disagreed with the single-build
        view would be worse than none. Groups are ordered by frequency, each carrying the advice sentence, the platforms it happened on and
        one bounded example. `summary` states the leading cause so the caller does not have to derive it.
      operationId: buildFailureStats
      security: [{SessionCookie: []}]
      parameters:
        - name: since
          in: query
          description: Window, as a duration (`24h`) or a bare number of hours (`12`). Default 24h, capped at 720h.
          schema: {type: string, default: 24h}
        - name: format
          in: query
          description: >-
            csv returns the table as a file with one row per (cause, platform) - a comma-joined platform list would need parsing again
            at the other end, and the counts would stop adding up.
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: Failure causes in the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      since: {type: string, format: date-time}
                      window_hours: {type: integer}
                      total_failed: {type: integer}
                      summary: {type: string}
                      note: {type: string}
                      causes:
                        type: array
                        items:
                          type: object
                          properties:
                            code: {type: string, description: Same closed set as error_hint}
                            advice: {type: string}
                            count: {type: integer}
                            platforms:
                              type: array
                              items: {type: string}
                            example: {type: string, description: One bounded failure text}
        '400': {description: since is not a duration or an hour count}
  /api/stats/tasks/duration:
    get:
      tags: [Statistics]
      summary: Task duration percentiles, per type or per agent
      description: >-
        Answers "which task types are getting slow" (and "which beacon is slow" with
        group_by=agent) from the final-state task history. Only tasks that reached a
        final state are counted, because a pending row has no duration. Reads at most
        5000 rows per request and reports `truncated` when the window had more, so a
        percentile is never silently computed from a partial sample.
      operationId: taskDurationStats
      security: [{SessionCookie: []}]
      parameters:
        - name: since
          in: query
          description: Window, either a duration (1h, 24h, 7d, 30d) or an RFC3339 timestamp
          schema: {type: string, default: 24h}
        - name: type
          in: query
          description: Restrict to one task type
          schema: {type: string}
        - name: group_by
          in: query
          description: Key the rows by task type or by agent id
          schema: {type: string, enum: [type, agent], default: type}
        - name: bucket
          in: query
          description: >-
            Add a time series (hourly or daily) so a regression's start can be located.
            Empty buckets are omitted rather than emitted as zeros.
          schema: {type: string, enum: [hour, day]}
        - name: engagement
          in: query
          description: >-
            Scope the report to one exercise (numeric id) or, with `none`, to hosts in no exercise - the same scope the
            failure reports take. "How slow was THIS exercise" is a review question, and an unscoped answer to it is the
            wrong answer. It is part of the cache identity, so two consumers looking at different exercises cannot be served
            each other's cached answer.
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv returns the table as a downloadable file (Key, Hostname, Count, Mean, p50, p95, Max, Completed, Failed,
            Success rate) with `X-Task-Export-Scope`. A CSV request **bypasses the cache**: the cache key does not carry the
            format (it is a rendering, not a filter), so serving one rendering from another would be a silent mismatch.
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: >-
            Per-key count/mean/p50/p95/max plus completed/failed/success_rate, ordered by
            p95 descending. With bucket=, also `buckets`. The rows live under `types` or
            `agents`, named after group_by.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      since: {type: string}
                      group_by: {type: string}
                      window_ms: {type: integer}
                      sampled: {type: integer}
                      truncated: {type: boolean}
                      types:
                        type: array
                        items:
                          type: object
                          properties:
                            type: {type: string}
                            count: {type: integer}
                            mean_ms: {type: number}
                            p50_ms: {type: number}
                            p95_ms: {type: number}
                            max_ms: {type: number}
                            completed: {type: integer}
                            failed: {type: integer}
                            success_rate: {type: number}
                            hostname: {type: string}
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            start: {type: string}
                            count: {type: integer}
                            p50_ms: {type: number}
                            p95_ms: {type: number}
                            max_ms: {type: number}
                            failed: {type: integer}
                            success_rate: {type: number}
        '400':
          description: Invalid since, group_by or bucket
  /api/tasks/{taskId}/output:
    get:
      tags: [Tasks]
      summary: One task's result as a plain text file
      description: >-
        A file is what an operator wants for a large result. A failed task still
        downloads, and the file ends with the error rather than silently omitting why it
        failed; nothing to download is a 404 with a reason instead of a zero-byte file.
      operationId: downloadTaskOutput
      security: [{SessionCookie: []}]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: >-
            The result (and the error, when the task failed) as text/plain. Supports byte ranges, so a large
            result can be resumed or fetched in pieces: the response advertises `Accept-Ranges: bytes` and a
            `Range` request answers 206 with `Content-Range`.
          headers:
            Accept-Ranges: {schema: {type: string}, description: Always "bytes"}
            ETag:
              schema: {type: string}
              description: >-
                A strong validator for this exact output. Send it as If-Range with a Range request: if the task was
                re-run and the result changed, the server answers 200 with the whole document instead of splicing
                the new bytes onto a half-fetched old download.
            X-Task-Status: {schema: {type: string}, description: Stored task status}
            X-Task-Final:
              schema: {type: string}
              description: '"true" when the stored result is final (status completed)'
          content:
            text/plain:
              schema: {type: string}
        '206':
          description: A partial response for a Range request, with Content-Range describing it
        '404':
          description: No such task, or the task has no output yet
        '416':
          description: The requested range is not satisfiable
  /api/agents/{id}/tasks/rerun-failed:
    post:
      tags: [Tasks]
      summary: Re-queue an agent's failed tasks
      description: >-
        Recovery after an outage fails everything queued against one beacon at once.
        Re-queues the agent's failed tasks newest-first, excluding control types such as
        kill_agent (reported in `excluded` rather than silently dropped). Each clone
        carries a deterministic rerun key, so a second click reports `already queued`
        instead of queuing the same work twice.
      operationId: rerunFailedTasks
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          description: Agent id
          schema: {type: string}
        - name: since
          in: query
          description: Window over created_at
          schema: {type: string, default: 24h}
        - name: limit
          in: query
          description: Maximum tasks to re-queue (default 10, max 25)
          schema: {type: integer, default: 10, maximum: 25}
        - name: type
          in: query
          description: Restrict to one task type
          schema: {type: string}
      responses:
        '200':
          description: queued count and ids, skipped entries with reasons, excluded count, truncated flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      queued: {type: integer}
                      task_ids:
                        type: array
                        items: {type: integer}
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            type: {type: string}
                            reason: {type: string}
                      excluded: {type: integer}
                      truncated: {type: boolean}
        '400':
          description: Invalid since or limit

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: forgec2_session
      description: Session cookie obtained from login endpoint
    AgentToken:
      type: apiKey
      in: query
      name: token
      description: Per-session agent token handed out when the WebRTC session starts

  schemas:

    MacroInput:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, maxLength: 128}
        description: {type: string}
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [command]
            properties:
              command: {type: string}
              delay_ms: {type: integer, minimum: 0, maximum: 3600000}
              wait: {type: boolean}
              timeout_s: {type: integer, minimum: 0, maximum: 1800}
              stop_on_error: {type: boolean}
    SavedViewInput:
      type: object
      required: [page, name, state]
      properties:
        page: {type: string}
        name: {type: string}
        state: {type: string}
    NotificationRouteInput:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [discord, telegram, webhook]
        target: {type: string, description: Webhook URL or chat id}
        secret: {type: string, description: Bot token; write-only}
        min_severity:
          type: string
          enum: [info, low, medium, high, critical]
        enabled: {type: boolean}
    SIEMRuleInput:
      type: object
      required: [name, action]
      properties:
        name: {type: string}
        action: {type: string}
        window_sec: {type: integer, minimum: 1}
        threshold: {type: integer, minimum: 1}
        alert_action: {type: string}
        alert_details: {type: string}
        enabled: {type: boolean}
    AIRunInput:
      type: object
      required: [session_id, messages]
      properties:
        session_id: {type: integer}
        profile_id: {type: integer, nullable: true}
        idempotency_key: {type: string, maxLength: 100}
        attachment_ids: {type: array, maxItems: 5, items: {type: string, format: uuid}}
        knowledge_collection_ids: {type: array, items: {type: integer}}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AIChatMessageInput'}
        context:
          type: object
          properties:
            page: {type: string}
            agent_id: {type: string}
            allow_low_risk_writes: {type: boolean}
    AIChatMessageInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
          maxLength: 98304
        tool_name:
          type: string
          maxLength: 100

    SuccessResponse:
      type: object
      description: |
        Every JSON 200 response uses this envelope: respond() wraps the handler
        payload exactly once as {"success": true, "data": <payload>}. Errors are
        {"success": false, "error": "..."} on a non-2xx status. A JSON 200
        schema is expressed as an allOf of this component plus a data property
        holding the per-operation payload schema.
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: The handler payload (shape documented per operation).
        message:
          type: string

    TaskResponse:
      type: object
      required: [success, task_id]
      properties:
        success:
          type: boolean
          example: true
        task_id:
          type: integer

    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        details:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        uptime:
          type: string
        database:
          type: string
          description: connected, unreachable or unavailable
        backup:
          type: object
          description: Backup freshness (retain, age_seconds, last_success, last_failure, last_error)
          additionalProperties: true
        audit_chain:
          type: object
          description: >-
            Result of the tamper-evident audit hash chain check the console polls.
            Cached for 60 seconds; /ready verifies on every poll.
          properties:
            ok:
              type: boolean
            checked:
              type: integer
            first_bad_id:
              type: integer
            reason:
              type: string

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          description: ok or not ready
          example: ok
        checks:
          type: object
          additionalProperties: true
          description: Component readiness (database, listeners, 鈥?

    ModuleInfo:
      type: object
      properties:
        name:
          type: string
          example: Invoke-Mimikatz.ps1
        size:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    UpdateCheckStatus:
      type: object
      description: Result of the background version check
      properties:
        current_version:
          type: string
        checked_at:
          type: string
          format: date-time
        update_available:
          type: boolean
        check_ok:
          type: boolean
          description: False when the last check failed - the update state is then unknown, not "up to date"
        check_state:
          type: string
          enum: [ok, error, unknown]
        latest_version:
          type: string
        download_url:
          type: string
        check_error:
          type: string

    UpdateVersionInfo:
      type: object
      description: Version comparison shown in the console
      properties:
        current_version:
          type: string
        is_latest:
          type: boolean
          description: True only when a check succeeded and no newer release exists
        check_ok:
          type: boolean
        check_state:
          type: string
          enum: [ok, error, unknown]
        checked_at:
          type: string
          format: date-time
        latest_version:
          type: string
        download_url:
          type: string
        check_error:
          type: string

    UpdateProgress:
      type: object
      description: Hot-update progress state
      properties:
        stage:
          type: string
          enum: [idle, checking, downloading, verifying, snapshotting, restarting, failed, done]
        percent:
          type: integer
        downloaded:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        version:
          type: string
        error:
          type: string
        updated_at:
          type: string
          format: date-time
        last_result:
          type: object
          description: Outcome of the last update attempt
          properties:
            status:
              type: string
              enum: [success, failed, rolled_back, interrupted]
            version:
              type: string
            at:
              type: string
              format: date-time
            error:
              type: string

    ModulesListResponse:
      type: object
      required: [success, modules]
      properties:
        success:
          type: boolean
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleInfo'
        hint:
          type: string
          description: Operator guidance (e.g. upload mimikatz script)

    ModuleUploadResponse:
      type: object
      properties:
        success: { type: boolean }
        name: { type: string }
        size: { type: integer }

    ModuleDeployRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Module filename under data/modules
        path:
          type: string
          description: Remote path on agent (default C:/Windows/Temp/<name>)

    AgentListResponse:
      type: object
      description: |
        Envelope varies by handler. Common JSON forms include
        `{ agents: [...] }` or paginated `{ Agents|agents, Total, Page }`.
      properties:
        success:
          type: boolean
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    DashboardStats:
      type: object
      description: Aggregate agent/task counters for the operator dashboard
      properties:
        success:
          type: boolean
        total_agents:
          type: integer
        online_agents:
          type: integer
        stale_count:
          type: integer
        offline_count:
          type: integer
        total_tasks:
          type: integer
        tasks_today:
          type: integer
        pending_tasks:
          type: integer
        failed_tasks:
          type: integer
        total_listeners:
          type: integer
        protocol_version:
          type: integer
          description: The wire protocol version the server speaks
        protocol_compat_window:
          type: integer
          description: How many older protocol versions the server still serves (0 = only the current one)
        protocol_outdated_agents:
          type: integer
          description: Agents that speak a protocol version the server would refuse
        protocol:
          type: object
          description: The protocol negotiation state (current version, window, version history)
          properties:
            current_version:
              type: integer
            compat_window:
              type: integer
            versions:
              type: array
              items:
                type: object
                properties:
                  version:
                    type: integer
                  deprecated:
                    type: boolean
                  server_compatible:
                    type: boolean
                  since:
                    type: string
                  note:
                    type: string
                  status:
                    type: string
                    enum: [current, served, window_closed, incompatible]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer, guest]
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
        last_ip:
          type: string
        last_activity:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique agent identifier
        hostname:
          type: string
        username:
          type: string
        os:
          type: string
          example: Windows 10 Pro
        arch:
          type: string
          example: amd64
        ip:
          type: string
        public_ip:
          type: string
        country:
          type: string
        city:
          type: string
        last_seen:
          type: string
          format: date-time
        status:
          type: string
          enum: [online, stale, offline]
        notes:
          type: string
        tags:
          type: string
        listener_id:
          type: integer
        parent_id:
          type: string
          description: Parent agent ID for P2P chaining
        p2p_mode:
          type: string
          enum: [smb, tcp, ""]
        p2p_listen_addr:
          type: string
        version:
          type: string
        pid:
          type: integer
        process_name:
          type: string
        integrity:
          type: string
          enum: [Low, Medium, High, System]
        elevated:
          type: boolean
        domain:
          type: string
        current_interval:
          type: integer
          description: Sleep interval in seconds
        current_jitter:
          type: integer
          description: Jitter percentage
        protocol_version:
          type: integer
          description: Wire protocol version the agent speaks (0 = not reported yet)
        protocol_outdated:
          type: boolean
          description: The agent speaks a protocol version the server would refuse - rebuild it
        protocol_current:
          type: integer
          description: The wire protocol version the server speaks
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        type:
          type: string
          description: Task type
        command:
          type: string
          description: Primary command or path
        shell:
          type: string
          description: Shell choice or secondary data
        path:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, pending_approval]
        result:
          type: string
        error:
          type: string
        progress:
          type: integer
          description: 0-100 percentage
        total_bytes:
          type: integer
          format: int64
        transferred:
          type: integer
          format: int64
        created_by:
          type: string
        claimed_by:
          type: string
        claimed_at:
          type: string
          format: date-time
        operator_claimed_by:
          type: string
          description: Operator collaboration claim (UI); distinct from the beacon dispatch claim in claimed_by
        operator_claimed_at:
          type: string
          format: date-time
        approval_expires_at:
          type: string
          format: date-time
          description: Auto-reject deadline for pending_approval tasks
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tenant_id:
          type: string

    Listener:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scheme:
          type: string
          enum: [http, https, tcp, tls, dns, icmp, ssh, h2c]
        type:
          type: string
          enum: [http, tcp, dns, icmp, ssh, h2c]
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
        notes:
          type: string
        enabled:
          type: boolean
