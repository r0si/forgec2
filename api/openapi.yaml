      description: List the current user's API keys
      operationId: listApiKeys
      security:
        - SessionCookie: []
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            prefix:
                              type: string
                            last_used:
                              type: string
                            expires_at:
                              type: string
                            active:
                              type: boolean
                            scopes:
                              type: string
                              description: Comma-separated permission scopes; empty means full access
                            allowed_cidrs:
                              type: string
                              description: Comma-separated source CIDRs; empty means any source
                            created_at:
                              type: string
    post:
      tags: [Settings]
      summary: Create API key
      description: Create a new API key. The plaintext key is returned once and will not be shown again.
      operationId: createApiKey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  description: RFC3339 expiry timestamp
                scopes:
                  type: array
                  items:
                    type: string
                  description: Permission scopes (e.g. agents.read); empty means full access
                allowed_cidrs:
                  type: string
                  description: Comma-separated source CIDRs or IPs; empty means any source
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          data:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              key:
                                type: string
                                description: Plaintext API key (shown once)
                              prefix:
                                type: string
                              scopes:
                                type: string
                              allowed_cidrs:
                                type: string
                              created_at:
                                type: string
                              expires_at:
                                type: string
                          message:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
