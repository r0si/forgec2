  /api/agents/bulk/expiry:
    post:
      tags: [Agents]
      summary: Set or clear the deadline for a whole selection
      description: >-
        Ending an exercise means time-boxing every host, and doing that one agent at a time is forty requests and one
        omission away from a beacon that outlives the engagement. Select with `agent_ids` (at most 500) or with
        `engagement_id`, then set `expires_at` (RFC3339, a past instant is allowed - it is how an operator says "end this
        now without killing the host") or `clear: true`. **The strictness is the point:** ids the caller cannot see are
        returned in `skipped` rather than silently dropped, because "I set 39 of 40" must not look like success, and
        another tenant's agents are never touched. Every application is audited as `agent_expiry_bulk` with its counts.
      operationId: bulkSetAgentExpiry
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_ids:
                  type: array
                  items: {type: string}
                engagement_id: {type: integer}
                expires_at: {type: string, description: RFC3339; empty unless clear is true}
                clear: {type: boolean}
      responses:
        '200':
          description: What was applied and what was skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      updated: {type: integer}
                      expires_at: {type: string, description: The applied deadline, or "cleared"}
                      skipped:
                        type: array
                        description: Requested ids the caller could not see
                        items: {type: string}
                      engagement_id: {type: integer}
        '400':
          description: No selection, no deadline, a malformed deadline, or more than 500 ids
  /api/agents/{id}/expiry:
    post:
      tags: [Agents]
      summary: Set, extend or clear an implant's engagement deadline
      description: >-
        The deadline made enforceable in this release is settable at build time through the registration
        secret; this lets an operator record an extension, a scope reduction, or an immediate end for one
        host without rebuilding the implant. A deadline in the past is accepted on purpose - it is how an
        engagement ends for a single host right now - and the response reports `expired: true` instead of
        pretending it is scheduled. Every change is audited with the previous value, because moving a
        deadline is a decision about the engagement rather than a UI toggle.
      operationId: setAgentExpiry
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Agent id
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at:
                  type: string
                  format: date-time
                  description: RFC3339 deadline; a value in the past ends the engagement for this host now
                clear:
                  type: boolean
                  description: Remove the deadline entirely (unbounded, the historic behaviour)
      responses:
        '200':
          description: New deadline, the previous one, and whether it is already in the past
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      agent_id: {type: string}
                      expires_at: {type: string, description: RFC3339, or "none"}
                      previous: {type: string, description: RFC3339, or "none"}
                      expired: {type: boolean}
        '400':
          description: Neither expires_at nor clear, or expires_at is not RFC3339
        '404':
          description: No such agent in the caller's tenant
  /api/exports/capabilities:
    get:
      tags: [Exports]
      summary: What the download endpoints accept
      description: >-
        Machine-readable description of the export and download surface: the formats each endpoint serves, the
        parameters it honours, the row and byte caps it enforces, the selectable columns and presets (task export
        only), the response headers that carry meaning, and the constraints a client cannot infer - notably that the
        audit export offers **no column projection**, because offline verification needs every field the entry hash
        covers. The values are derived from the code that enforces them, so the document cannot drift from the
        behaviour without a test failing.
      operationId: exportCapabilities
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Per-endpoint capabilities plus the shared limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      task_export: {$ref: '#/components/schemas/ExportCapabilities'}
                      audit_export: {$ref: '#/components/schemas/ExportCapabilities'}
                      task_output_download: {$ref: '#/components/schemas/ExportCapabilities'}
                      plugins_index: {$ref: '#/components/schemas/ExportCapabilities'}
                      engagement_bundle:
                        type: object
                        description: The handover archive; signing state is reported so an operator need not produce one to find out.
                        properties:
                          path: {type: string}
                          verify_path: {type: string}
                          members:
                            type: array
                            items: {type: string}
                          signed: {type: boolean}
                          signature_algorithm: {type: string}
                          public_key: {type: string, description: Empty when unsigned; hand it to the receiver for verification}
                          headers:
                            type: array
                            items: {type: string}
                          notes:
                            type: array
                            items: {type: string}
                      diagnostics:
                        type: array
                        description: >-
                          The endpoints that answer "what would happen" and execute nothing: the automation previews, the
                          rule-set health report, the composed diagnosis and the notification delivery preview. Listed
                          here because a client author who cannot enumerate them has to read the source.
                        items:
                          type: object
                          properties:
                            path: {type: string}
                            method: {type: string}
                            answers: {type: string}
                            side_effects:
                              type: boolean
                              description: >-
                                True for the one diagnostic that acts outside the server (the route test delivers a real
                                message). A client offering "run all diagnostics" must exclude those.
                            body:
                              type: array
                              items: {type: string}
                            notes:
                              type: array
                              items: {type: string}
                      maintenance:
                        type: array
                        description: >-
                          Endpoints that change what a report will say next, listed apart from the diagnostics because
                          every diagnostic answers a question. Each names the audit action it writes.
                        items:
                          type: object
                          properties:
                            path: {type: string}
                            method: {type: string}
                            clears: {type: string}
                            audited: {type: string}
                            params:
                              type: array
                              items: {type: string}
                      diagnostic_rate_limit:
                        type: object
                        description: >-
                          The diagnostics family is throttled separately from the write endpoints it shares a permission
                          with. Published so a client can back off before it receives a 429 (which carries Retry-After),
                          and derived from the constants the limiter uses.
                        properties:
                          requests: {type: integer}
                          window_seconds: {type: integer}
                          scope: {type: string}
                          notes:
                            type: array
                            items: {type: string}
                      signature_kinds:
                        type: object
                        description: >-
                          The four things this system calls a "signature", published so a client compares against strings rather
                          than prose: only the bundle and plugin kinds are keyed; the audit chain is an unkeyed hash and the
                          failure shape is not cryptographic at all, so neither should be described as authenticated.
                        properties:
                          audit: {type: string}
                          bundle: {type: string}
                          plugin: {type: string}
                          failure: {type: string}
                          note: {type: string}
                      exposure:
                        type: object
                        description: >-
                          The response headers the two downloads use to say what they contain. A filtered export looks exactly
                          like an unfiltered one, so each file carries its own scope; published by name because a client
                          should not have to reverse-engineer a header from a changelog.
                        properties:
                          task_export_scope_header: {type: string}
                          audit_export_scope_header: {type: string}
                          scope_format: {type: string}
                          task_export_truncated_header: {type: string}
                          audit_export_truncated_header: {type: string}
                          audit_export_filtered_header: {type: string}
                      limits:
                        type: object
                        properties:
                          task_export_rows: {type: integer}
                          audit_export_rows: {type: integer}
                          audit_export_bytes: {type: integer}
                          stats_sample_rows: {type: integer}
  /api/engagements:
    get:
      tags: [Engagements]
      summary: List the tenant's engagements
      description: >-
        Engagements are the time-boxed container above the tenant: a tenant isolates data, an engagement
        bounds when work may happen. Each entry carries a derived `state` (scheduled, active, ended,
        closed) so a caller does not have to compare timestamps itself. Tenant-scoped; newest window
        first.
      operationId: listEngagements
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Engagements ordered by start, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      count: {type: integer}
                      engagements:
                        type: array
                        items: {$ref: '#/components/schemas/Engagement'}
    post:
      tags: [Engagements]
      summary: Create an engagement
      description: >-
        Refuses a window that overlaps another OPEN engagement in the same tenant (409): two simultaneous
        exercises against one customer is almost always a mistake, and it is better refused at creation
        than discovered when two teams task the same host. Closed engagements are history and never block
        a new one.
      operationId: createEngagement
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, starts_at, ends_at]
              properties:
                name: {type: string, maxLength: 128}
                notes: {type: string, maxLength: 1024}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        '200':
          description: The created engagement, with its derived state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      engagement: {$ref: '#/components/schemas/Engagement'}
        '400':
          description: Missing name, unparseable timestamps, or ends_at not after starts_at
        '409':
          description: The window overlaps an existing open engagement for this tenant
  # closing also accepts {"stamp_agents": true}, which writes the closing instant onto every member host so the deadline
  # lives on the agent as well as on the exercise. Dispatch already refuses tasks after a close, so this is defence in
  # depth for an operator reading the agent list; it is opt-in because a close is bookkeeping and must not silently write
  # forty agent rows.
  /api/engagements/{id}/close:
    post:
      tags: [Engagements]
      summary: End an engagement early
      description: >-
        Sets closed_at without rewriting the agreed window: closing early is a decision, and the original
        dates stay auditable. Closing an already-closed engagement is a 409; another tenant's engagement
        is a 404.
      operationId: closeEngagement
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: The engagement with state "closed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      engagement: {$ref: '#/components/schemas/Engagement'}
        '404':
          description: No such engagement in the caller's tenant
        '409':
          description: Already closed
  /api/engagements/{id}/summary/export:
    get:
      tags: [Engagements]
      summary: Download an engagement summary as a document
      description: >-
        The same summary the JSON endpoint returns, rendered for a reader who was not there: Markdown by
        default (window, fleet covered, task outcomes, audited actions as a table) or the raw JSON with
        `format=json`. Buffered before anything is written, so a partial download is never something that
        still opens. Tenant-scoped; another tenant's engagement is a 404.
      operationId: exportEngagementSummary
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - name: format
          in: query
          description: Markdown (default) or json
          schema: {type: string, enum: [markdown, json], default: markdown}
      responses:
        '200':
          description: Markdown or JSON document, filename carries the id and a timestamp
          content:
            text/markdown:
              schema: {type: string}
            application/json:
              schema:
                type: object
        '400':
          description: Unknown format
        '404':
          description: No such engagement in the caller's tenant
  /api/engagements/{id}/summary:
    get:
      tags: [Engagements]
      summary: What one engagement actually did
      description: >-
        A read-only roll-up over the engagement's own window: the fleet it covered and how those hosts
        ended up, the tasks run and their outcomes, and the audited actions taken while it was open. The
        window runs from `starts_at` to the earliest of `ends_at`, `closed_at` and now, because counting
        past the effective end would attribute the next engagement's work to this one. Tasks are counted
        only for agents linked to this engagement. Tenant-scoped; another tenant's engagement is a 404.
      operationId: engagementSummary
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fleet counts, task outcomes and the highest-count audited actions inside the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      engagement: {$ref: '#/components/schemas/Engagement'}
                      window:
                        type: object
                        properties:
                          starts_at: {type: string, format: date-time}
                          ends_at: {type: string, format: date-time, description: earliest of agreed end, close time and now}
                          open: {type: boolean}
                      agents:
                        type: object
                        properties:
                          total: {type: integer}
                          online: {type: integer}
                          expired: {type: integer}
                      tasks:
                        type: object
                        properties:
                          pending: {type: integer}
                          running: {type: integer}
                          completed: {type: integer}
                          failed: {type: integer}
                      actions:
                        type: array
                        description: Audited actions inside the window, highest count first (max 25)
                        items:
                          type: object
                          properties:
                            action: {type: string}
                            count: {type: integer}
        '404':
          description: No such engagement in the caller's tenant
  /api/engagements/{id}/bundle:
    get:
      tags: [Engagements]
      summary: One zip that hands over the whole exercise
      description: >-
        Ending an engagement means delivering it, and collecting the evidence by hand is four downloads and a
        spreadsheet - with the audit part the step that gets skipped, which is exactly the part an after-action
        reviewer needs. This assembles `summary.md` (the same document the summary export renders), `timeline.md`
        (the audited actions and task outcomes interleaved by time - the exercise as a story, for a reader who will
        not open a spreadsheet), `tasks.csv`
        (the default export columns, the engagement's hosts, rows inside its window), `audit.ndjson` (every hashed
        field of the window, verifiable offline), `agents.json` and `plugins.json` into one archive. Refused with 413
        rather than truncated when it would exceed the bundle cap, because a half-delivered bundle is a handover that
        silently lacks evidence. Tenant-scoped: another tenant's engagement is a 404. The handover is audited as
        `engagement_bundle`.
      operationId: engagementBundle
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - name: include
          in: query
          description: >-
            Comma-separated members to include: summary.md, timeline.md, tasks.csv, audit.ndjson, agents.json,
            credentials.json, iocs.json, plugins.json. Absent means all of them. A customer-facing handover can
            therefore leave out the credential inventory it does not need, and MANIFEST.json is always written
            because without it the archive cannot be verified. An unknown name is a 400 listing the valid ones.
          schema: {type: string}
      responses:
        '200':
          description: >-
            application/zip with summary.md, timeline.md, tasks.csv, audit.ndjson, agents.json, credentials.json,
            iocs.json, failures.json, plugins.json and MANIFEST.json. The response announces transport-level facts so a script
            have to unzip to learn them.
          headers:
            X-Bundle-SHA256:
              schema: {type: string}
              description: SHA-256 of the archive itself, comparable before it is opened
            X-Bundle-Members:
              schema: {type: integer}
              description: How many members travelled (the manifest lists the same set)
            X-Bundle-Signed:
              schema: {type: boolean}
              description: Whether the manifest was signed (FORGEC2_BUNDLE_SIGNING_KEY configured)
            X-Bundle-Signature-Algorithm:
              schema: {type: string}
              description: Present when signed
            X-Bundle-Public-Key:
              schema: {type: string}
              description: Present when signed; compare it with the key you already trust
          content:
            application/zip:
              schema: {type: string, format: binary}
        '404':
          description: No such engagement in the caller's tenant
        '413':
          description: The bundle would exceed the size cap; export the parts separately
  /api/engagements/{id}/bundle/verify:
    post:
      tags: [Engagements]
      summary: Check an uploaded bundle against its own manifest
      description: >-
        The receiving side of a handover. A bundle travels - emailed, copied, re-zipped, sometimes transcoded by a mail
        gateway - and `MANIFEST.json` publishes a SHA-256 per member, so this re-computes them from the uploaded archive
        and reports what is intact, what changed, what is missing, what arrived unlisted, and which members published no
        digest (`MANIFEST.json` itself, by construction). **What it proves and what it does not:** the digests are
        **unkeyed** and the manifest travels **inside** the archive, so a deliberate rebuild of every member and every
        digest verifies. Like the audit chain, this detects damage and partial edits, not an adversary who redoes the
        whole package; the response says so in a `note` rather than implying more.
      operationId: verifyEngagementBundle
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: The engagement the bundle belongs to (must be visible to the caller)
          schema: {type: integer}
        - name: public_key
          in: query
          description: >-
            The hex Ed25519 public key the caller already trusts. Supplying it turns `signature.valid` into
            `signature.trusted`, because a key carried inside the archive proves nothing about origin - swap the
            manifest and the key together and every digest still matches.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: The verdict, with per-member problems
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      ok: {type: boolean, description: True when nothing mismatched, was missing or arrived unlisted}
                      checked: {type: integer}
                      verified: {type: integer}
                      mismatched:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            problem: {type: string}
                      unverifiable:
                        type: array
                        description: Members with no published digest
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            problem: {type: string}
                      extra:
                        type: array
                        description: Members present in the archive but not listed in the manifest
                        items: {type: string}
                      engagement:
                        type: object
                        properties:
                          id: {type: integer}
                          name: {type: string}
                      generated_at: {type: string}
                      signature:
                        type: object
                        properties:
                          present: {type: boolean}
                          valid: {type: boolean, description: The signature verifies against the key it carries}
                          trusted: {type: boolean, description: Valid AND signed by the public_key the caller supplied}
                          algorithm: {type: string}
                          public_key: {type: string}
                          signed_members: {type: integer}
                          problem: {type: string}
                      note: {type: string, description: The stated limitation of an unkeyed, self-contained manifest}
        '400':
          description: Empty or non-zip body, missing MANIFEST.json, or a manifest that is not valid JSON
        '404':
          description: No such engagement in the caller's tenant
  /api/engagements/expiry:
    get:
      tags: [Engagements]
      summary: Engagement deadlines across the fleet
      description: >-
        Summarises how the caller's fleet ages out: how many implants are already expired, how many
        expire within 24 hours or a week, how many have no deadline at all, and the earliest deadline
        overall. Reading this is how an operator notices that a deadline is about to stop work - the
        alternative is a 403 appearing one day with no warning. Tenant-scoped; the list is ordered by
        deadline, and each engagement carries its own roll-up (`agents`, `agents_expired`,
        `ends_in_seconds`) because the deadline that stops work usually belongs to an exercise rather
        than to one host.
      operationId: engagementExpiry
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Deadline buckets, the earliest deadline, the bounded implants and a per-engagement roll-up
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      total: {type: integer}
                      bounded: {type: integer, description: Implants that carry a deadline}
                      unbounded: {type: integer, description: Implants with no deadline}
                      expired: {type: integer}
                      within_24h: {type: integer}
                      within_7d: {type: integer}
                      earliest:
                        type: object
                        properties:
                          agent_id: {type: string}
                          hostname: {type: string}
                          expires_at: {type: string, format: date-time}
                          expired: {type: boolean}
                      agents:
                        type: array
                        items:
                          type: object
                          properties:
                            agent_id: {type: string}
                            hostname: {type: string}
                            expires_at: {type: string, format: date-time}
                            expired: {type: boolean}
                      engagements:
                        type: array
                        description: One entry per engagement in the tenant, ordered by when it ends
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            state:
                              type: string
                              enum: [scheduled, active, ended, closed]
                            starts_at: {type: string, format: date-time}
                            ends_at: {type: string, format: date-time}
                            closed_at: {type: string, format: date-time}
                            active: {type: boolean}
                            agents: {type: integer, description: Implants linked to this engagement}
                            agents_expired: {type: integer}
                            ends_in_seconds: {type: integer}

  /api/plugins/failures:
    get:
      tags: [Plugins]
      summary: Packages on disk that could not be registered
      description: >-
        A package that fails to register is **silently absent**: it never appears in the plugin list, it cannot be run, and
        the only trace was a startup warning - so an operator who installed a plugin and sees nothing assumes the console is
        stale rather than that the manifest was rejected. This lists the rejected packages with the reason the manager
        recorded and, where the reason is recognisable, a `hint` for the next step (re-stamp after signing, run
        `cmd/plugin-check`, add the signing key). The list is the **rejected** set, not the installed set, and it is sorted by
        name so successive polls can be compared. A server with no plugin directory reports `plugins_enabled: false`
        instead of claiming zero failures for a directory it never scanned.
      operationId: pluginLoadFailures
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Rejected packages, sorted by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      plugins_enabled: {type: boolean}
                      count: {type: integer}
                      failures:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            reason: {type: string}
                            hint: {type: string, description: Present only when the reason is recognisable}
  /api/plugins/index:
    get:
      tags: [Plugins]
      summary: The installed plugin set as a verifiable index document
      description: >-
        One machine-readable document describing every installed plugin: name, version, type,
        interpreter, entry, parameter names, whether it is signed, whether the package is currently
        loaded, and the package DIGEST computed with the same function the trust policy uses
        (plugin.PackageDigest). The digest is what makes the index verifiable rather than descriptive -
        a receiver can recompute it and compare. A record whose package directory is missing is
        reported with `loaded: false` and no digest instead of a fabricated one. The list is sorted by
        name, so two deployments can be diffed.
      operationId: pluginIndex
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Sorted plugin index with per-package digests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      count: {type: integer}
                      plugins:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            version: {type: string}
                            type: {type: string}
                            description: {type: string}
                            author: {type: string}
                            category: {type: string}
                            interpreter: {type: string}
                            entry: {type: string}
                            params:
                              type: array
                              items: {type: string}
                            digest:
                              type: string
                              description: '"sha256:..." computed by plugin.PackageDigest; empty when the package is missing'
                            signed: {type: boolean}
                            loaded: {type: boolean}
  /api/plugins/index/verify:
    post:
      tags: [Plugins]
      summary: Compare an index document against what is installed
      description: >-
        Installs nothing and fetches nothing: the uploaded index is compared with the installation and
        the difference is reported as `missing` (in the index, not installed), `extra` (installed, not
        in the index), `changed` (a package digest or version differs) and `unverifiable` (the index
        entry carries no digest, so nothing can be proven). `in_sync` is true only when every entry was
        CHECKED and matched - an unverifiable entry makes it false rather than granting a false
        all-clear. Every comparison is audited with its counts.
      operationId: verifyPluginIndex
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plugins]
              properties:
                plugins:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      version: {type: string}
                      digest:
                        type: string
                        description: sha256 digest as exported by GET /api/plugins/index
      responses:
        '200':
          description: Difference report (missing / extra / changed / unverifiable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      in_sync: {type: boolean}
                      checked: {type: integer}
                      missing:
                        type: array
                        items: {$ref: '#/components/schemas/PluginIndexDifference'}
                      extra:
                        type: array
                        items: {$ref: '#/components/schemas/PluginIndexDifference'}
                      changed:
                        type: array
                        items: {$ref: '#/components/schemas/PluginIndexDifference'}
                      unverifiable:
                        type: array
                        items: {$ref: '#/components/schemas/PluginIndexDifference'}
        '400':
          description: Empty, malformed or oversized index document
  /api/plugins:
    get:
      tags: [Plugins]
      summary: List plugins
      description: Get all installed plugins
      operationId: listPlugins
      security:
        - SessionCookie: []
      parameters:
        - name: format
          in: query
          description: >-
            csv returns the inventory as a downloadable file (ID, Name, Version, Type, Category, Author, Enabled) with
            X-Task-Export-Scope and X-Export-Truncated when the 200-row cap cut the answer. The per-plugin
            /api/plugins/{id}/export packages ONE plugin, which is a different artefact from what is installed at what version.
          schema: {type: string, enum: [json, csv], default: json}
        - name: search
          in: query
          description: Match name, description or author
          schema: {type: string}
        - name: category
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Plugins list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plugin'
    post:
      tags: [Plugins]
      summary: Create plugin
      description: Register a new plugin
      operationId: createPlugin
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginCreate'
      responses:
        '200':
          description: Plugin created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Plugin'
  /api/plugins/{id}/toggle:
    post:
      tags: [Plugins]
      summary: Toggle plugin
      description: Enable or disable a plugin
      operationId: togglePlugin
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plugin toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/plugins/{id}:
    get:
      tags: [Plugins]
      summary: Get plugin detail
      operationId: getPlugin
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plugin detail
    delete:
      tags: [Plugins]
      summary: Delete plugin
      description: Delete a plugin
      operationId: deletePlugin
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plugin deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /agents/{id}/token/list:
    get:
      tags: [Tokens, Agents]
      summary: List tokens
      description: List stolen/created tokens for an agent
      operationId: getTokens
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token list
          content:
            application/json:
