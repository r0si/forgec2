  /audit/verify:
    get:
      tags: [Audit]
      summary: Verify the audit hash chain
      description: Walk the newest audit rows and report whether the tamper-evident hash chain is intact
      operationId: verifyAuditChain
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          description: How many of the newest rows to check (default 1000, max 5000)
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Verification verdict (ok=false is a finding, not a server error)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          checked:
                            type: integer
                          first_bad_id:
                            type: integer
                          reason:
                            type: string
  /audit/export:
    get:
      tags: [Audit]
      summary: Export the audit chain
      description: Stream the audit hash chain as newline-delimited JSON for offline verification
      operationId: exportAuditChain
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of the newest rows to export (default 50000, max 200000)
          schema:
            type: integer
            default: 50000
        - name: since_id
          in: query
          description: >-
            Export only rows with a greater id. Ids are monotonic, so this makes
            the export incremental: fetch the rows appended since the copy you
            already verified, and stitch the two together via prev_hash.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: One JSON object per line, each with prev_hash and entry_hash
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          description: Database is not initialized
