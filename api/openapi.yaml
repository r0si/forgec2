    get:
      tags: [Audit]
      summary: Current audit chain head, for out-of-band archiving
      description: >-
        The newest audit row's id and entry hash, plus whether the server-side
        anchor file agrees with the table. Pasting this into an incident report
        gives a later investigator something a rewrite of the table cannot
        reproduce.
      operationId: getAuditChainAnchor
      security:
        - SessionCookie: []
      responses:
