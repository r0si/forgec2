  /api/stats/tasks/duration:
    get:
      tags: [Statistics]
      summary: Task duration percentiles, per type or per agent
      description: >-
        Answers "which task types are getting slow" (and "which beacon is slow" with
        group_by=agent) from the final-state task history. Only tasks that reached a
        final state are counted, because a pending row has no duration. Reads at most
        5000 rows per request and reports `truncated` when the window had more, so a
        percentile is never silently computed from a partial sample.
      operationId: taskDurationStats
      security: [{SessionCookie: []}]
      parameters:
        - name: since
          in: query
          description: Window, either a duration (1h, 24h, 7d, 30d) or an RFC3339 timestamp
          schema: {type: string, default: 24h}
        - name: type
          in: query
          description: Restrict to one task type
          schema: {type: string}
        - name: group_by
          in: query
          description: Key the rows by task type or by agent id
          schema: {type: string, enum: [type, agent], default: type}
        - name: bucket
          in: query
          description: >-
            Add a time series (hourly or daily) so a regression's start can be located.
            Empty buckets are omitted rather than emitted as zeros.
          schema: {type: string, enum: [hour, day]}
      responses:
        '200':
          description: >-
            Per-key count/mean/p50/p95/max plus completed/failed/success_rate, ordered by
            p95 descending. With bucket=, also `buckets`. The rows live under `types` or
            `agents`, named after group_by.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      since: {type: string}
                      group_by: {type: string}
                      window_ms: {type: integer}
                      sampled: {type: integer}
                      truncated: {type: boolean}
                      types:
                        type: array
                        items:
                          type: object
                          properties:
                            type: {type: string}
                            count: {type: integer}
                            mean_ms: {type: number}
                            p50_ms: {type: number}
                            p95_ms: {type: number}
                            max_ms: {type: number}
                            completed: {type: integer}
                            failed: {type: integer}
                            success_rate: {type: number}
                            hostname: {type: string}
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            start: {type: string}
                            count: {type: integer}
                            p50_ms: {type: number}
                            p95_ms: {type: number}
                            max_ms: {type: number}
                            failed: {type: integer}
                            success_rate: {type: number}
        '400':
          description: Invalid since, group_by or bucket
  /api/tasks/{taskId}/output:
    get:
      tags: [Tasks]
      summary: One task's result as a plain text file
      description: >-
        A file is what an operator wants for a large result. A failed task still
        downloads, and the file ends with the error rather than silently omitting why it
        failed; nothing to download is a 404 with a reason instead of a zero-byte file.
      operationId: downloadTaskOutput
      security: [{SessionCookie: []}]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: The result (and the error, when the task failed) as text/plain
          headers:
            X-Task-Status: {schema: {type: string}, description: Stored task status}
            X-Task-Final:
              schema: {type: string}
              description: '"true" when the stored result is final (status completed)'
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: No such task, or the task has no output yet
  /api/agents/{id}/tasks/rerun-failed:
    post:
      tags: [Tasks]
      summary: Re-queue an agent's failed tasks
      description: >-
        Recovery after an outage fails everything queued against one beacon at once.
        Re-queues the agent's failed tasks newest-first, excluding control types such as
        kill_agent (reported in `excluded` rather than silently dropped). Each clone
        carries a deterministic rerun key, so a second click reports `already queued`
        instead of queuing the same work twice.
      operationId: rerunFailedTasks
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          description: Agent id
          schema: {type: string}
        - name: since
          in: query
          description: Window over created_at
          schema: {type: string, default: 24h}
        - name: limit
          in: query
          description: Maximum tasks to re-queue (default 10, max 25)
          schema: {type: integer, default: 10, maximum: 25}
        - name: type
          in: query
          description: Restrict to one task type
          schema: {type: string}
      responses:
        '200':
          description: queued count and ids, skipped entries with reasons, excluded count, truncated flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      queued: {type: integer}
                      task_ids:
                        type: array
                        items: {type: integer}
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            type: {type: string}
                            reason: {type: string}
                      excluded: {type: integer}
                      truncated: {type: boolean}
        '400':
          description: Invalid since or limit

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: forgec2_session
      description: Session cookie obtained from login endpoint
    AgentToken:
      type: apiKey
      in: query
      name: token
      description: Per-session agent token handed out when the WebRTC session starts

  schemas:

    MacroInput:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, maxLength: 128}
        description: {type: string}
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [command]
            properties:
              command: {type: string}
              delay_ms: {type: integer, minimum: 0, maximum: 3600000}
              wait: {type: boolean}
              timeout_s: {type: integer, minimum: 0, maximum: 1800}
              stop_on_error: {type: boolean}
    SavedViewInput:
      type: object
      required: [page, name, state]
      properties:
        page: {type: string}
        name: {type: string}
        state: {type: string}
    NotificationRouteInput:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [discord, telegram, webhook]
        target: {type: string, description: Webhook URL or chat id}
        secret: {type: string, description: Bot token; write-only}
        min_severity:
          type: string
          enum: [info, low, medium, high, critical]
        enabled: {type: boolean}
    SIEMRuleInput:
      type: object
      required: [name, action]
      properties:
        name: {type: string}
        action: {type: string}
        window_sec: {type: integer, minimum: 1}
        threshold: {type: integer, minimum: 1}
        alert_action: {type: string}
        alert_details: {type: string}
        enabled: {type: boolean}
    AIRunInput:
      type: object
      required: [session_id, messages]
      properties:
        session_id: {type: integer}
        profile_id: {type: integer, nullable: true}
        idempotency_key: {type: string, maxLength: 100}
        attachment_ids: {type: array, maxItems: 5, items: {type: string, format: uuid}}
        knowledge_collection_ids: {type: array, items: {type: integer}}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AIChatMessageInput'}
        context:
          type: object
          properties:
            page: {type: string}
            agent_id: {type: string}
            allow_low_risk_writes: {type: boolean}
    AIChatMessageInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
          maxLength: 98304
        tool_name:
          type: string
          maxLength: 100

    SuccessResponse:
      type: object
      description: |
        Every JSON 200 response uses this envelope: respond() wraps the handler
        payload exactly once as {"success": true, "data": <payload>}. Errors are
        {"success": false, "error": "..."} on a non-2xx status. A JSON 200
        schema is expressed as an allOf of this component plus a data property
        holding the per-operation payload schema.
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: The handler payload (shape documented per operation).
        message:
          type: string

    TaskResponse:
      type: object
      required: [success, task_id]
      properties:
        success:
          type: boolean
          example: true
        task_id:
          type: integer

    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        details:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        uptime:
          type: string
        database:
          type: string
          description: connected, unreachable or unavailable
        backup:
          type: object
          description: Backup freshness (retain, age_seconds, last_success, last_failure, last_error)
          additionalProperties: true
        audit_chain:
          type: object
          description: >-
            Result of the tamper-evident audit hash chain check the console polls.
            Cached for 60 seconds; /ready verifies on every poll.
          properties:
            ok:
              type: boolean
            checked:
              type: integer
            first_bad_id:
              type: integer
            reason:
              type: string

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          description: ok or not ready
          example: ok
        checks:
          type: object
          additionalProperties: true
          description: Component readiness (database, listeners, 鈥?

    ModuleInfo:
      type: object
      properties:
        name:
          type: string
          example: Invoke-Mimikatz.ps1
        size:
          type: integer
