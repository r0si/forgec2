                              type: string
                            expires_at:
                              type: string
                            active:
                              type: boolean
                            scopes:
                              type: string
                              description: Comma-separated permission scopes; empty means full access
                            allowed_cidrs:
                              type: string
                              description: Comma-separated source CIDRs; empty means any source
                            created_at:
                              type: string
    post:
      tags: [Settings]
      summary: Create API key
      description: Create a new API key. The plaintext key is returned once and will not be shown again.
      operationId: createApiKey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  description: RFC3339 expiry timestamp
                scopes:
                  type: array
                  items:
                    type: string
                  description: Permission scopes (e.g. agents.read); empty means full access
                allowed_cidrs:
                  type: string
                  description: Comma-separated source CIDRs or IPs; empty means any source
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
