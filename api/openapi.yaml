                              name:
                                type: string
                              key:
                                type: string
                                description: Plaintext API key (shown once)
                              prefix:
                                type: string
                              scopes:
                                type: string
                              allowed_cidrs:
                                type: string
                              created_at:
                                type: string
                              expires_at:
                                type: string
                          message:
