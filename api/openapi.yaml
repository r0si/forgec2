      description: Walk the newest audit rows and report whether the tamper-evident hash chain is intact
      operationId: verifyAuditChain
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          description: How many of the newest rows to check (default 1000, max 5000)
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Verification verdict (ok=false is a finding, not a server error)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          checked:
                            type: integer
                          first_bad_id:
                            type: integer
                          reason:
                            type: string
  /audit/export:
    get:
      tags: [Audit]
      summary: Export the audit chain
      description: Stream the audit hash chain as newline-delimited JSON for offline verification
      operationId: exportAuditChain
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of the newest rows to export (default 50000, max 200000)
          schema:
            type: integer
            default: 50000
        - name: since_id
          in: query
          description: >-
            Export only rows with a greater id. Ids are monotonic, so this makes
            the export incremental: fetch the rows appended since the copy you
            already verified, and stitch the two together via prev_hash.
          schema:
            type: integer
            default: 0
        - name: since
          in: query
          description: >-
            Lower time bound, from the same parser the task export uses (relative 24h/7d or an RFC3339
            instant). Duration bounds are measured backwards from now; an RFC3339 value is an absolute
            instant. A time bound makes the export a SELECTION, so the response carries the
            `X-Audit-Export-Filtered` warning, and `X-Audit-Export-Scope` names every filter that shaped the rows
            (semicolon-separated, sorted, or `all`) so an investigator holding the file can reproduce the selection instead of
            guessing which of six filters produced it.
          schema: {type: string}
        - name: until
          in: query
          description: Upper time bound, same spellings as since; must not precede it
          schema: {type: string}
        - name: format
          in: query
          description: >-
            ndjson (default) streams one row per line; json returns a single document with count, truncated, filtered and
            rows. Both carry the same row objects, with both hashes and every hashed field - they are the VERIFIABLE artefact,
            and the format is part of the ETag. `ecs` and `cef` are SIEM **projections** for tools that ingest security events:
            they carry the ECS vocabulary (event.action/outcome, user.name, source.ip, host.id, message) or the CEF header plus
            extensions, but they **drop the hash chain**, so a file in either format cannot verify the log. Both say so in a 199
            Warning header and are delivered under their own extension (`.ecs.ndjson`, `.cef`) so a collector globbing for the
            verifiable export cannot pick up a projection by mistake.
          schema: {type: string, enum: [ndjson, json, ecs, cef], default: ndjson}
      responses:
        '200':
          description: One JSON object per line, each with prev_hash and entry_hash
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          description: Database is not initialized
  /audit/anchor:
    get:
      tags: [Audit]
      summary: Current audit chain head, for out-of-band archiving
      description: >-
        The newest audit row's id and entry hash, plus whether the server-side
        anchor file agrees with the table. Pasting this into an incident report
        gives a later investigator something a rewrite of the table cannot
        reproduce.
      operationId: getAuditChainAnchor
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Chain head
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          entry_hash:
                            type: string
                          created_at:
                            type: string
                          anchor_matches:
                            type: boolean
                          anchor_recorded:
                            type: boolean
  /tasks:
    get:
      tags: [Tasks]
      summary: Task history page
      description: Render task history HTML page
      operationId: getTaskHistory
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Task history page
          content:
            text/html:
              schema:
                type: string

  /tasks/export:
    get:
      tags: [Tasks]
      summary: Export tasks
      description: >-
        Export task history as CSV, optionally bounded by time, engagement and a row limit. `since`/`until`
        accept the dashboard relative form (`24h`, `7d`) or an RFC3339 instant, from the same parser the audit
        export uses, so "since 24h" cannot mean two different things depending on which export is open. A
        relative bound is measured backwards from now. `engagement=<id>` selects one exercise and
        `engagement=none` the tasks of agents that belong to none. Responses carry `X-Task-Export-Truncated`,
        `X-Task-Export-Scope` (every filter that shaped the rows, semicolon-separated and sorted, or `all`) and support
        `If-None-Match`, so a re-fetch of an unchanged window is a bodiless 304. The scope header exists because a filtered
        file looks exactly like an unfiltered one: the receiver has no other way to tell a scoped sample from the whole
        picture.
      operationId: exportTasks
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Maximum rows (default and cap ExportTaskLimit)
          schema: {type: integer}
        - name: since
          in: query
          description: Lower time bound, e.g. 24h, 7d or RFC3339
          schema: {type: string}
        - name: until
          in: query
          description: Upper time bound, same spellings as since
          schema: {type: string}
        - name: engagement
          in: query
          description: Engagement id, or "none" for agents in no exercise
          schema: {type: string}
        - name: format
          in: query
          description: >-
            csv (default) or json. The JSON variant carries the same rows, the same redaction and the same
            column truncation, so a script and a spreadsheet never disagree about what a cell held; the format
            is part of the ETag, so a revalidated CSV cannot answer a JSON request with 304.
          schema: {type: string, enum: [csv, json], default: csv}
        - name: fields
          in: query
          description: >-
            Comma-separated columns, in the order wanted: time, agent, type, command, result, error, status,
            task_id, engagement, agent_id, retry_count. Three presets cover the common requests: `minimal`
            (task_id, agent, type, status), `default` (the historical set, format-aware) and `full` (every
            column, including agent_id). A preset must be the whole value - `minimal,time` is a 400 rather than a
            guess - and an unknown name is a 400 naming the valid fields and presets. Absent means the default,
            and the resolved selection is part of the ETag because two column sets are two documents.
          schema: {type: string}
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        '304':
          description: The caller already holds this export (If-None-Match matched)
        '400':
          description: Invalid since/until, since after until, or an invalid engagement value

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task details
      description: >-
        Detailed information about one task. A failed task with a message additionally carries `failure_reason`, the same
        code vocabulary the failure report groups by (`timeout`, `access_denied`, `defender`, `not_found`, `network`,
        `dns`, `tls`, `unsupported`, `disk`, `cancelled`, `other`), so a client can label a task without shipping its
        own copy of the classification rules. A task that ran more than once also carries `retry_count`, because an
        automatic retry makes the result a second attempt and nothing else in the document says so.
      operationId: getTaskDetails
      security:
        - SessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/approve:
    post:
      tags: [Tasks]
      summary: Approve AI-generated task
      description: Approve a task that is awaiting operator approval (status pending_approval). Only approved tasks are picked up by the agent.
      operationId: approveTask
      security:
        - SessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          message:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/reject:
    post:
      tags: [Tasks]
      summary: Reject AI-generated task
      description: Reject a task awaiting operator approval. The task is cancelled and never reaches the agent.
      operationId: rejectTask
      security:
        - SessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          message:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/batch-status:
    post:
      tags: [Tasks]
      summary: Batch task status
      description: Return the status of multiple tasks in a single request.
      operationId: batchTaskStatus
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [task_ids]
              properties:
                task_ids:
                  type: string
                  description: Comma-separated task IDs (e.g. "1,2,3")
      responses:
        '200':
          description: Task statuses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            status:
                              type: string
                            result:
                              type: string
                            error:
                              type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/automation/diagnose:
    post:
      tags: [Automation]
      summary: What fires for this event, and who would be told
      description: >-
        The composed answer, for debugging an automation set without correlating two endpoints by hand: the same
        automation batch preview (which rules would fire, how many are blocked by conditions or cooldown) plus
        the notification delivery verdict for a candidate severity (how many of the configured routes would
        deliver). Runs nothing - no rule fires, no notification is persisted, no task is created - and the call
        is audited as `automation_diagnose`. The `notification` block is optional and defaults to severity `info`.
      operationId: diagnoseAutomation
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: {type: string}
                agent_id: {type: string}
                agent_host: {type: string}
                agent_ip: {type: string}
                agent_os: {type: string}
                user: {type: string}
                data: {type: object}
                notification:
                  type: object
                  properties:
                    title: {type: string}
                    message: {type: string}
                    severity: {type: string, enum: [info, warning, critical]}
      responses:
        '200':
          description: Both verdicts for one event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      event_type: {type: string}
                      notification_title: {type: string}
                      automation: {type: object, description: Same shape as /api/automation/preview}
                      notifications:
                        type: object
                        description: >-
                          Same shape as /api/notification-routes/preview, plus delivery health per route (`state`,
                          `delivered`, `failed`) because "would deliver" and "has been failing all morning" are different
                          answers to the same question.
        '400':
          description: Missing event_type, malformed body or unknown notification severity
  /api/automation/action-stats/reset:
    post:
      tags: [Automation]
      summary: Clear a rule's action counters
      description: >-
        A rule whose action failed for a week and was then fixed would keep an error-level `action_failing` finding
        forever, and an indicator that can only get worse is one operators learn to ignore. Clearing one rule (`?id=`)
        leaves the others alone; omitting `id` clears every counter and reports how many it removed. An unknown rule is a
        404 rather than a silent no-op, because "the finding is gone" and "the id was a typo" must not look the same.
        Both forms are audited as `automation_action_stats_reset`.
      operationId: resetAutomationActionStats
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: query
          description: Rule id (a string, not a number); omit to clear every counter
          schema: {type: string}
      responses:
        '200':
          description: How many counters were removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      cleared: {type: integer}
                      scope: {type: string, enum: [rule, all]}
                      rule_id: {type: string}
        '400': {description: The id was given in the wrong shape}
        '404': {description: No such rule}
  /api/automation/rules/{id}/test:
    post:
      tags: [Automation]
      summary: Run one rule's actions now
      description: >-
        The previews answer "would this fire" and the notification route test answers "does this channel deliver"; nothing
        answered **do this rule's actions actually work**, which an operator otherwise learns when the event they cared about
        finally arrives. This EXECUTES the rule's actions against a synthetic event built from the rule (its event type and,
        where it names one, its agent), and reports per-action dispatch failures with their reasons - the failures the
        dispatcher itself knows. **Three deliberate guards:** the body must say `{"confirm": true}` (it dispatches tasks and
        sends messages), it is rate-limited per rule (10 s, `Retry-After` on 429), and every executed test is audited as
        `automation_rule_test`. Every outcome is also counted into the rule's action statistics, so a test that fails shows up
        in the health report and a test that succeeds after a fix clears it. **What it cannot promise:** a webhook action is
        sent in a goroutine, so its delivery result arrives after the response and is counted on the route - the `note` in the
        answer says so rather than implying otherwise.
      operationId: testAutomationRule
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, description: Must be true; this executes the rule}
      responses:
        '200':
          description: What ran, what failed, and against which synthetic event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      rule_id: {type: string}
                      executed: {type: integer}
                      failed: {type: integer}
                      errors:
                        type: array
                        items: {type: string}
                      event:
                        type: object
                        properties:
                          event_type: {type: string}
                          agent_id: {type: string}
                          hostname: {type: string}
                      note: {type: string}
        '400': {description: Missing confirm, or a malformed body}
        '404': {description: No such rule in the caller's tenant}
        '429': {description: This rule was tested moments ago; see Retry-After}
  /api/automation/rules/export:
    get:
      tags: [Automation]
      summary: Export the whole rule set
      description: >-
        The set form of the single-rule export: one document with `version`, `count` and `rules`, each in the **portable**
        shape (no ids, timestamps or ownership). A version field exists so a future change to the document can be recognised
        rather than guessed at, and the count lets a receiver notice a truncated file before importing it.
      operationId: exportAutomationRules
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: The caller's rule set as one document
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      version: {type: integer}
                      count: {type: integer}
                      rules:
                        type: array
                        items: {type: object}
  /api/automation/rules/{id}/export:
    get:
      tags: [Automation]
      summary: Export one rule in a portable shape
      description: >-
        A rule set is configuration an operator rebuilds every exercise, and retyping conditions is where a mistyped
        `contains` lives on as a rule that simply never matches. The export is deliberately **portable**: it carries the
        rule's meaning - name, event type, conditions, actions, cooldown, schedule - and **not** the database id, timestamps,
        run counts or tenant, which a destination could only pretend to know. Another tenant's rule is a 404, not a redacted
        document.
      operationId: exportAutomationRule
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The portable rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      rule:
                        type: object
                        properties:
                          name: {type: string}
                          event_type: {type: string}
                          enabled: {type: boolean}
                          conditions: {type: array, items: {type: object}}
                          actions: {type: array, items: {type: object}}
                          cooldown_seconds: {type: integer}
                          schedule: {type: string}
        '404': {description: No such rule in the caller's tenant}

  /api/automation/rules/import:
    post:
      tags: [Automation]
      summary: Create a rule from a portable document
      description: >-
        The receiving half of the export. The id is derived from the name on first import and **kept on overwrite**, so
        importing the same document twice is idempotent rather than creating twins. A name collision is refused with **409**
        unless `overwrite` is set, because an import that silently replaces a rule the operator built by hand is worse than a
        rejection. Documents without a name, an event type or at least one action are **400**: a rule without an event type
        never fires, and one without actions does nothing when it does. Both outcomes are audited
        (`automation_rule_import`, `automation_rule_import_overwrite`).
      operationId: importAutomationRule
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: {type: object, description: One rule, same shape as the export}
                rules:
                  type: array
                  description: >-
                    A whole set. A partial success is the normal case for a bulk import, so the response is per rule
                    (created/replaced/conflict/invalid with reasons) rather than one status for the document.
                  items: {type: object}
                overwrite: {type: boolean, description: Replace rules with the same name}
                dry_run:
                  type: boolean
                  description: >-
                    Answer "what would this do" without writing: the same verdicts and the same reference warnings, no rows.
                    A preview cannot disagree with the import that follows it, because only the write is skipped. A
                    set-level preview is audited as `automation_rule_import_preview`, so "who checked what an import would
                    do" has an answer.
      responses:
        '200':
          description: The created or replaced rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      rule_id: {type: string}
                      overwrote: {type: boolean}
                      enabled: {type: boolean}
                      warnings:
                        type: array
                        description: >-
                          References in the imported document that do not resolve here (agent, script, macro). The import
                          still SUCCEEDS - a rule may legitimately arrive before the agent it targets - but the operator is
                          looking at the answer, which is the only moment the mismatch is cheap to fix.
                        items: {type: string}
        '400': {description: Missing name, missing event type, no actions, or a malformed body}
        '409': {description: A rule with that name already exists and overwrite was not set}

  /api/automation/events:
    get:
      tags: [Automation]
      summary: The event types a rule may listen to
      description: >-
        The published registry, so a console can build its event dropdown instead of hardcoding strings. A test ties this list to the
        registry constants **and** to `docs/AUTOMATION_RULES.md`, because three surfaces describing one set is how a console ends up
        offering an event no rule can receive. Payload fields per event are documented on the page rather than repeated here; the
        operators are `contains`, `equals` and `regex`, and anything else is refused at save time.
      operationId: listAutomationEvents
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      count: {type: integer}
                      note: {type: string}
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_type: {type: string}
                            answers: {type: string, description: What the event means, in one phrase}
                            fields:
                              type: array
                              description: >-
                                Payload keys a condition may reference, besides agent.hostname which every event resolves. Always an array:
                                an empty list means "this event carries no payload fields", which a caller must be able to tell from
                                "unknown".
                              items: {type: string}
  /api/automation/health:
    get:
      tags: [Automation]
      summary: Static health of the automation rule set
      description: >-
        The checks no per-event preview can reach, derived from stored data. Three findings are reported:
        `unconditional_mutating_action` (a rule with no conditions whose action changes state - it fires on
        every event of its type; a notify-only rule of the same shape is not reported, because it is noisy
        rather than dangerous), `missing_agent` / `missing_script` / `missing_macro` (an action targeting a
        resource that no longer exists, which would log a failure on every firing, forever), and
        `duplicate_rule` (two rules with the same event, conditions and actions, so the actions run twice).
        Target lookups include tenant-0 rows, because legacy and globally-shared resources are real targets
        and crying wolf is how a health check gets ignored. Read-only: nothing is modified and no action runs.
      operationId: automationHealth
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Findings, errors first, plus summary counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          rules: {type: integer}
                          errors: {type: integer}
                          warnings: {type: integer}
                      rules:
                        type: array
                        description: >-
                          Firing statistics per rule. A rule that has never fired (after a 24 h grace, so a rule created
                          minutes ago is not reported) and one that fires constantly look identical in the rule list, and
                          both are operational facts.
                        items:
                          type: object
                          properties:
                            rule_id: {type: string}
                            rule_name: {type: string}
                            enabled: {type: boolean}
                            run_count: {type: integer}
                            last_triggered: {type: string, nullable: true}
                            action_state:
                              type: string
                              enum: [unused, dispatching, degraded, failing]
                              description: >-
                                Whether the rules action DISPATCHES are landing. run_count counts firings, not successes,
                                so a rule firing into a void looked identical to one that works.
                            actions_ok: {type: integer}
                            actions_failed: {type: integer}
                            last_action_error: {type: string}
                      findings:
                        type: array
                        items:
                          type: object
                          properties:
                            rule_id: {type: string}
                            rule_name: {type: string}
                            severity: {type: string, enum: [error, warning]}
                            code:
                              type: string
                              enum:
                                - unconditional_mutating_action
                                - missing_agent
                                - missing_script
                                - missing_macro
                                - duplicate_rule
                                - never_fired
                                - firing_often
                                - action_failing
                                - target_unavailable
                            detail: {type: string}
  /api/automation/preview:
    post:
      tags: [Automation]
      summary: Which rules would fire for one event
      description: >-
        The other direction from the per-rule preview: given a synthetic event, report every rule of the
        caller's tenant that listens to it, whether it would fire, and if not why (`disabled`,
        `blocked_by_cooldown`, `blocked_by_conditions`). Rules for other event types are omitted rather than
        listed as "not firing", and rules of other tenants are never included. Uses the same cached snapshot
        and the same verdict function as the live event path, so a preview and a real evaluation cannot
        disagree. Executes nothing; every call is audited as `automation_preview_batch`.
      operationId: previewAutomationBatch
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: {type: string, description: e.g. implant.checkin, task.complete}
                agent_id: {type: string}
                agent_host: {type: string}
                agent_ip: {type: string}
                agent_os: {type: string}
                user: {type: string}
                data: {type: object}
      responses:
        '200':
          description: Summary counts plus one verdict per matching rule, firing rules first then by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      event_type: {type: string}
                      summary:
                        type: object
                        properties:
                          total: {type: integer}
                          would_run: {type: integer}
                          blocked_by_conditions: {type: integer}
                          blocked_by_cooldown: {type: integer}
                          disabled: {type: integer}
                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            rule_id: {type: string}
                            rule_name: {type: string}
                            enabled: {type: boolean}
                            would_run: {type: boolean}
                            matched: {type: boolean}
                            cooldown_open: {type: boolean}
                            cooldown_remaining: {type: integer}
                            first_reason: {type: string}
                            event_type: {type: string}
                      # The notification half of the same response carries delivery health per route:
