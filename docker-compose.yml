services:
  forgec2:
    build: .
    container_name: forgec2
    restart: unless-stopped
    ports:
      - "${FORGEC2_PORT:-8000}:8000"
      # Extra listener ports — uncomment only the transports you enabled in
      # config.yaml (binding host ports <1024 needs root on the host).
      # - "443:443"
      # - "8443:8443"
      # - "53:53/udp"
    volumes:
      # config.yaml MUST exist first (cp config.example.yaml config.yaml) —
      # otherwise Docker creates a directory here and the server won't start.
      - ./config.yaml:/data/config.yaml:ro
      - forgec2_data:/data
    environment:
      - FORGEC2_JWT_SECRET=${FORGEC2_JWT_SECRET:-}
      - FORGEC2_AI_API_KEY=${FORGEC2_AI_API_KEY:-}
      # Persistent state root: DB, keys, backups, logs, artifacts. Must match
      # the volume mount below, otherwise state lands in the container's
      # working directory and is lost on recreate.
      - FORGEC2_DATA_DIR=/data
      # 0.0.0.0 so the published port is actually reachable; the healthcheck
      # still runs inside the container, so loopback-only binding breaks
      # `docker compose up` + published ports without any visible error.
      - FORGEC2_HOST=${FORGEC2_HOST:-0.0.0.0} # use 127.0.0.1 to keep the API container-local
      - FORGEC2_PORT=${FORGEC2_PORT:-8000}
      # SQLite was the default (zero-config). For Postgres (now the default), set
      # FORGEC2_DB_DRIVER=postgres + FORGEC2_DB_DSN and enable the profile below:
      #   docker compose --profile postgres up -d --build
      - FORGEC2_DB_DRIVER=${FORGEC2_DB_DRIVER:-postgres}
      - FORGEC2_DB_PATH=${FORGEC2_DB_PATH:-/data/db/forgec2.db}
      - FORGEC2_DB_DSN=${FORGEC2_DB_DSN:-host=postgres user=forgec2 password=${DB_PASSWORD} dbname=forgec2 port=5432 sslmode=disable}
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: forgec2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgec2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD when using --profile postgres}
      POSTGRES_DB: forgec2
    volumes:
      # PostgreSQL 18 changed the image layout: PGDATA is now
      # /var/lib/postgresql/<major>/docker and the declared volume moved to
      # /var/lib/postgresql, so the data volume must be mounted at the parent
      # to persist across container re-creations. Pre-18 volumes (files at the
      # volume root) need a pg_upgrade or a re-init before 18 can serve them.
      - postgres_data:/var/lib/postgresql
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
      - CHOWN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forgec2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  forgec2_data:
  postgres_data:
