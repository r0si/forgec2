# ForgeC2 example configuration �?copy to config.yaml and customize.
# Sensitive values: leave empty to auto-generate on first run, or set via env:
#   FORGEC2_JWT_SECRET, FORGEC2_AI_API_KEY, FORGEC2_DB_DRIVER, FORGEC2_DB_DSN
#
# Storage keys (crypto.loot_key / extc2_key / backup_key / credential_key / csrf_key)
# also ship empty. The server generates any missing key at startup and writes
# it back to this file, so `cp config.example.yaml config.yaml` is a working
# first start. Set them explicitly (or via the matching FORGEC2_* env var) when
# the config file is mounted read-only, or to keep keys stable/portable.

server:
  port: 8000
  host: 0.0.0.0
  tls_enabled: true            # SECURE DEFAULT: HTTPS on by default; a self-signed cert is auto-generated at data/server.crt|key on first run
  cert_file: data/server.crt
  key_file: data/server.key
  require_tls_for_auth: true   # refuse to issue session cookies over plain HTTP
  jwt_secret: ""
  data_dir: data                # container deployments set FORGEC2_DATA_DIR=/data so state lands on the persistent volume
  offline_threshold: 60
  session_max_age_hours: 24
  cleanup_retention_days: 30
  # Unbound v3 registration secrets expire after this many hours (default 168 =
  # 7 days) and are rejected at authentication as well as swept hourly. Secrets
  # already bound to a deployed agent never expire.
  reg_secret_orphan_ttl_hours: 168
  enable_metrics: false
  socks_listen_host: "127.0.0.1"
  allowed_origins: []
  # trusted_proxies: ["127.0.0.1", "10.0.0.0/8"]  # reverse proxy IPs/CIDRs for X-Forwarded-For (empty = use direct client IP)
  # --- Operator-plane hardening (P1-4). Login + authenticated API/UI only;
  # beacons, payloads, phishing, extc2 and health stay world-reachable.
  # operator_allowed_cidrs: ["10.8.0.0/24", "203.0.113.7"]  # empty = disabled
  # operator_mtls: false                # require verified client certs on the operator plane (needs TLS)
  # operator_client_ca_file: ""         # PEM CA bundle for operator certs (independent from beacon mTLS CA)
  # Issue operator certs with: openssl req -x509 -newkey rsa:3072 -keyout op-ca.key -out op-ca.crt -days 365 -nodes -subj "/CN=fc2-operator-ca"
  #   then per operator: openssl req -newkey rsa:2048 -keyout op.key -out op.csr -nodes -subj "/CN=alice" && openssl x509 -req -in op.csr -CA op-ca.crt -CAkey op-ca.key -CAcreateserial -out op.crt -days 90
  #   use with: curl --cert op.crt --key op.key https://teamserver:8000/api/...
  cookie_domain: ""
  beacon_key: ""
  # Egress hygiene: update checks phone home to api.github.com - opt-in only.
  update_check_enabled: false
  # Repository the update checker polls (owner/name). Defaults to the
  # repository the binary was built from; point it at your own mirror when
  # you publish your own releases.
  update_check_repo: r0si/forgec2
  tcp_enabled: false
  dns_enabled: false
  grpc_enabled: false
  icmp_enabled: false
  udp_enabled: false
  udp_addr: ":8899"
  quic_enabled: false          # QUIC/HTTP3-like beacon (TLS 1.3, ALPN h3/fc2); requires cert_file/key_file
  quic_addr: ":4433"
  ssh_enabled: false
  ssh_port: 2222
  ssh_addr: ""                # bind addr for the SSH beacon listener (default ":ssh_port")
  ssh_user: forgec2           # SSH username accepted by the beacon listener (empty = any)
  ssh_password: ""            # SSH password (empty = accept any password or public key / key-only)
  ssh_key_auth: true          # allow public key authentication
  ssh_host_key: data/ssh_host_key   # SSH host key path (auto-generated if missing)
  lportfwd_enabled: true      # allow agents to open tunneled local port forwards
                              # (agent binds 127.0.0.1:lport, traffic egresses from the teamserver)
  dns_obscure: false          # XOR-obscure DNS C2 fragments (must match generated implants)
  auto_recon: []              # e.g. [hostinfo, process_tree] queued on first check-in
  pprof_addr: ""              # OPT-IN profiling endpoints (empty = off); loopback only, e.g. "127.0.0.1:6060". See docs/CAPACITY.md.

# Rules of engagement: refuse tasks whose command IPs fall outside allow or inside deny.
roe:
  enabled: false
  allow_cidrs: []             # e.g. ["10.0.0.0/8", "192.168.0.0/16"]
  deny_cidrs: []              # e.g. ["10.0.0.1/32"] hospital / ICS exclusions
  allow_domains: []           # e.g. ["corp.example.com"] suffix-matched hostnames
  deny_domains: []            # e.g. ["evil.example.com"]
  # Scope: network-operation types plus every dangerous type (credential
  # theft, persistence, EDR antagonism, destructive ops). Destructive
  # self-harm (uninstall/kill) is RoE-scoped like anything else; only
  # set_sleep/help/hostinfo bypass. Command, Data and Path are all scanned
  # (IPv4, IPv6 and hostnames).

listeners:
  h2c:
    enabled: false
    addr: ":8081"               # cleartext HTTP/2 (h2c) beacon listener bind addr

database:
  # v2.8 removed the SQLite driver: PostgreSQL is the only supported backend.
  # path: below is legacy and ignored when driver is postgres (kept so a
  # pre-2.8 config still parses). Point dsn at your PostgreSQL instance; the
  # docker-compose profile overrides these via FORGEC2_DB_DRIVER / FORGEC2_DB_DSN.
  driver: postgres
  dsn: "host=127.0.0.1 user=forgec2 password=forgec2 dbname=forgec2 port=5432 sslmode=disable"
  # path: data/db/forgec2.db   # legacy sqlite path, ignored under postgres

implant:
  default_interval: 15
  default_jitter: 30
  default_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
  default_skip_tls: false
  # Heartbeat randomization algorithm shipped into generated implants
  # (an operator can still override per-build on the Generate page):
  #   linear       - uniform random within +/-jitter% of the interval (default)
  #   gaussian     - normal distribution centered on the interval
  #   exponential  - exponential decay, biased toward shorter sleeps
  #   two_stage    - a random base interval (+/-30%) with jitter on top
  #   adaptive     - gaussian + environment-aware tuning
  # beacon_randomization: linear
  # Cap on the extra random delay added to a single beacon, in ms (0 = uncapped).
  # Keeps a high-jitter profile from sleeping long enough to trip the dead timeout.
  # max_random_interval_ms: 0

auth:
  password_hash: ""
  # First-boot admin password, used only when the DB has zero users.
  # Leave empty and a random strong password is generated on first start.
  # Never commit a default password.
  default_password: ""
  # Whether the first-boot banner prints that generated password in plaintext.
  # Default true: the banner is the ONLY place the one-shot credential is ever
  # shown, so an operator who misses it is locked out. The plaintext ends up in
  # your log file — rotate/delete logs after first boot, or set this to false to
  # redact and rely on `go run ./cmd/reset-password` instead.
  log_generated_password: true
  # Max live sessions per user (0 = unlimited). Overflow evicts the oldest
  # session first (audited as session_evict). Recommended: 5.
  # session_max_concurrent: 5

password_policy:
  min_length: 8
  require_upper: true
  require_lower: true
  require_digit: true
  require_symbol: false
  max_age_days: 0

plugins:
  # Ed25519 public keys (64 hex chars) that may sign plugin packages. A signed
  # manifest carries `digest: sha256:<hex>` over every package file and
  # `signature: <hex>` over that digest; both are verified on load/install.
  # Generate a keypair with: go run ./cmd/sign-plugin -gen
  #
  # The 52 bundled plugins are signed with a project key whose private half was
  # discarded after release, so those signatures can never be forged. Add your
  # own key to sign plugins you author; share paths (e.g. the shared lib/) are
  # covered through the manifest's `includes` list.
  trusted_keys:
    - "b5c42a42ed1409ff23e7c410d23bb44e707fad2e9ecd6c026a63c63192c15bf3"
  # Refuse unsigned plugin packages. Safe out of the box because the bundled
  # plugins are signed; third-party plugins must be signed to be installed.
  require_signed: true
  # Simultaneously running plugin processes (0 = default 4).
  max_concurrent: 4
  # CPU-time budget for one native plugin run, summed over its whole process
  # tree (seconds; 0 = default 120). Countered with the 300s wall-clock
  # ceiling: a spinning plugin is killed once it burns through this budget.
  max_cpu_seconds: 120
  # Bytes-written budget for one native plugin run, summed over its whole
  # process tree — file, pipe and console writes alike (MiB; 0 = default
  # 1024): a runaway writer is killed instead of filling the volume.
  max_write_mb: 1024

backup:
  # Encrypted database snapshots (.fbk). Retention used to be a hard-coded 7.
  retain: 14                    # 0 = built-in default (7)
  schedule: "daily"             # hourly | daily | weekly | monthly
  # Freshness is exported as forgec2_backup_age_seconds and reported by
  # GET /api/v1/health (`backup.age_seconds`), so a stalled job is visible.

crypto:
  key: "ecdh:"                 # REQUIRED: "ecdh:" enables ECDH+AES-256-GCM beacon encryption. The legacy XOR/plaintext modes were removed from the v2/v3 beacon protocol �?the server refuses to start with any other value (built implants cannot authenticate).
  loot_key: ""                 # REQUIRED: 64-char hex (32-byte) AES-256-GCM key for loot encryption (FC2ENC:); fresh installs auto-generate. NO longer derived from server.jwt_secret �?set it (or FORGEC2_LOOT_KEY) or startup fails. Existing FC2ENC: data encrypted with the legacy derived key cannot be decrypted after upgrade.
  extc2_key: ""                # REQUIRED: 64-char hex (32-byte) AES-256-GCM key for ExtC2 channels (FC2EXT:); fresh installs auto-generate. NO longer derived from server.jwt_secret (or FORGEC2_EXTC2_KEY).
  backup_key: ""               # REQUIRED: 64-char hex (32-byte) AES-256-GCM key for encrypted .fbk backups; fresh installs auto-generate. NO longer derived from crypto.key / server.jwt_secret (or FORGEC2_BACKUP_KEY). Legacy backups created with the derived key are not restorable after upgrade.
  totp_key: ""                 # REQUIRED: 64-char hex (32-byte) AES-256-GCM key for SMTP passwords / SSH-redirector passwords (the YAML name is kept for compatibility); fresh installs auto-generate (or FORGEC2_TOTP_KEY). Previously stored SMTP/SSH secrets may need re-entry after an upgrade.
  csrf_key: ""                 # REQUIRED: 64-char hex (32-byte) HMAC key binding CSRF tokens to sessions; fresh installs auto-generate (or FORGEC2_CSRF_KEY). Previously re-used the JWT secret �?now independent.
  # update_signing_key: ""       # OPTIONAL: 64-char hex (32-byte) Ed25519 PUBLIC key; when set, hot updates require a detached "<checksum>.sig" release signature (empty = checksum-only + warning). Generate offline: go run ./cmd/sign-release -gen (keep the seed in GitHub Secrets as RELEASE_SIGNING_KEY; the release workflow signs automatically).
  # require_release_signature: false  # when true, refuse hot updates if update_signing_key is empty (fail closed). Recommended for production; tag CI already refuses to ship unsigned releases.
  # session_cipher: ""           # OPTIONAL: "" or "aes-gcm" (default) or "chacha20" �?session AEAD suite (ChaCha20-Poly1305 when chacha20). Agreed at handshake (auth field sc); wire framing identical (12-byte nonce). Changing this requires rebuilt agents that parse sc.

malleable:
  enabled: false
  status_code: 200
  content_type: application/json
  headers:
    Server: nginx/1.24.0

ai:
  enabled: false
  provider: deepseek
  api_key: ""
  model: deepseek-chat
  allow_execute: false

logging:
  level: info

siem:
  enabled: false
  url: ""
  token: ""

socks:
  enabled: false
  auth_required: false

rate_limit:
  login:
    max_attempts: 5
    window: 900
    lockout_time: 900
  api:
    capacity: 100
    rate: 20
  beacon:
    limit: 120
    window: 60
  extc2:
    enabled: false
    api_token: ""

security:
  # Two-man rule for high-impact operations (kill/uninstall/lateral/ticket
  # forgery etc.): tasks of those types are created in "pending_approval"
  # state and require an operator DIFFERENT from the task creator to approve
  # them before the agent executes them. Secure default is true; single-operator
  # labs may set false explicitly (a startup warning is logged when off).
  require_approval: true

monitoring:
  # Metric alert bridge (OPT-IN): threshold checks over the Prometheus gauges
  # that fire a notification, an alert.triggered event and webhooks.
  alerts_enabled: false
  agents_online_min: 0     # alert when online agents <= this while any are registered
  tasks_pending_max: 100   # alert when the pending-task backlog exceeds this
  cooldown_seconds: 600    # per-rule silence window between repeat alerts
  eval_seconds: 30         # evaluation cadence

# Real-time remote desktop (WebRTC + embedded TURN). Off by default: enabling
# it opens a TURN/STUN listener that must be reachable by operators and agents.
# webrtc:
#   enabled: true
#   turn_addr: ":3478"          # UDP listen address; open this port in the firewall
#   public_ip: ""               # relay address peers should use; empty = first non-loopback IPv4
#   realm: forgec2
#   relay_min_port: 49152       # TURN relay allocation range (open UDP too)
#   relay_max_port: 65535
#   session_ttl_seconds: 3600
#   max_sessions: 32
